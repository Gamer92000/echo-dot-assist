# Not a Python package: the environment the PC tests run in (DEVELOPMENT.md "Build and test").  `uv sync` makes .venv
# from uv.lock, which pins every package down to the last dependency, so CI and every PC test against the same set.
# Change a version here, then `uv lock` and commit both.
[project]
name = "echo-dot-assist-tests"
version = "0"
requires-python = ">=3.13"
dependencies = [
    # Reference implementations the protocol tests run against
    "aioesphomeapi==46.4.1",
    "aiohttp==3.14.3",
    "aiosendspin[server]==9.1.1",     # the server side: tests/fake_ma_sendspin.py plays Music Assistant (PyAV, numpy, Pillow)
    "noiseprotocol==0.3.1",
    "wyoming==1.10.2",
    # Improv over Bluetooth (tests/fake_improv.py): Home Assistant's improv_ble client; its packaging lists no requirements
    "py-improv-ble-client==2.0.1",
    "bleak==3.0.2",
    "bleak-retry-connector==4.7.1",
    # microWakeWord (tests/unit/mww_ref.py, tests/fake_web_mww.py): its front end, its models, TFLite's reference kernels
    "pymicro-features==2.0.2",
    "pymicro-wakeword==2.5.0",
    "ai-edge-litert==2.3.0",
]

[tool.uv]
package = false
