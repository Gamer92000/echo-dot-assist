# Builds every model, runs the PC tests, and publishes the update bundles that online updates install (src/hassmic/update.c).
#   push to main     prerelease  v<version>-beta  (the "beta" channel)
#   push to release  release     v<version>       (the "release" channel)
#   pull request     build and test only
# A beta is skipped when no model's bundle holds anything new (scripts/content-id.sh): CI, test and doc changes.
# The version is the commit's time in UTC, 2026.10.02.091530 (make version): nothing to bump, and a commit published
# as beta and later as release has the same version, so an Echo on beta is not offered the same build again.
# The firmware is not public: device binaries link against stand-ins for the stock libraries (make STUBS=1,
# devices/<codename>/stubs/, tools/mkstubs.sh), which gives the same binaries byte for byte.  Bundles are signed with the
# release key (secret RELEASE_SIGNING_KEY: base64 of secrets/release.key); Echos check them against keys/release.pub.
# The key is a secret of the environment "release", which only main and release may use: only the release job names
# it, so builds of pull requests and other branches never run with it, and their bundles are signed with a throwaway key.
# Under nektos/act everything runs except the publishing itself, which only says what it would do.
name: build

on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NDK_URL: https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
  NDK_SHA256: ad7ce5467e18d40050dc51b8e7affc3e635c85bd8c59be62de32352328ed467e

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # earlier tags
      - id: v
        run: |
          version=$(make -s version RELEASE=1)
          case "$version" in 20[0-9][0-9].[01][0-9].[0-3][0-9].[0-9][0-9][0-9][0-9][0-9][0-9]) ;; *) echo "::error::odd version '$version'"; exit 1;; esac
          if [ "$GITHUB_REF" = refs/heads/release ]; then tag=v$version prerelease=false; else tag=v$version-beta prerelease=true; fi
          publish=false
          if [ "$GITHUB_EVENT_NAME" = push ] && { [ "$GITHUB_REF" = refs/heads/main ] || [ "$GITHUB_REF" = refs/heads/release ]; }; then
              publish=true
              # a run again for the same commit (re-run, or a push that only moved the branch back)
              if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then echo "::notice::$tag is published already"; publish=false; fi
          fi
          echo "version=$version tag=$tag prerelease=$prerelease publish=$publish"
          { echo "version=$version"; echo "tag=$tag"; echo "prerelease=$prerelease"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [donut, biscuit, radar, checkers]
        include:
          # where Wi-Fi motion's kernel module is built from, for the cache; what is downloaded is pinned in device.mk or
          # the Makefile (make kernel-tools)
          - device: donut
            ksrc: linux-4.4.22
            kcc: aarch64-linux-android-4.9
          - device: biscuit
            ksrc: linux-3.18.19
            kcc: arm-eabi-4.8
          - device: radar
            ksrc: linux-3.18.19
            kcc: arm-eabi-4.8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # git describe, compiled in

      # Under act the toolchains are on a volume shared by the jobs (DEVELOPMENT.md): that is the cache there, and a
      # restore would unpack over a compiler another job is running ("Text file busy").
      - name: NDK cache
        if: ${{ !env.ACT }}
        id: ndk
        uses: actions/cache@v6
        with:
          path: toolchain/android-ndk-r21e
          key: ndk-r21e
      - name: NDK r21e
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          [ -x toolchain/android-ndk-r21e/ndk-build ] && exit 0      # act with toolchain/ on a volume (DEVELOPMENT.md)
          mkdir -p toolchain
          curl -fsSL -o ndk.zip "$NDK_URL"
          echo "$NDK_SHA256  ndk.zip" | sha256sum -c -
          unzip -q ndk.zip -d toolchain
          rm ndk.zip

      - name: Kernel build tools
        if: matrix.ksrc
        run: command -v bc > /dev/null || { sudo apt-get update && sudo apt-get install -y bc; }     # timeconst.h
      # keyed on the download command itself: the URLs and checksums make kernel-tools uses
      - name: Kernel pins
        if: matrix.ksrc
        id: kpins
        run: echo "key=$(make -s -n kernel-tools DEVICE=${{ matrix.device }} STUBS=1 | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Kernel cache
        if: matrix.ksrc && !env.ACT
        id: kernel
        uses: actions/cache@v6
        with:
          path: |
            toolchain/${{ matrix.ksrc }}
            toolchain/${{ matrix.kcc }}
          key: kernel-${{ matrix.ksrc }}-${{ matrix.kcc }}-${{ steps.kpins.outputs.key }}
      # the same download as the guided setup's (scripts/kernel-tools.sh: retried, checked against the pins)
      - name: Kernel sources and compiler
        if: matrix.ksrc && steps.kernel.outputs.cache-hit != 'true'
        run: make -s kernel-tools DEVICE=${{ matrix.device }} STUBS=1

      - name: Build
        run: |
          make -j"$(nproc)" DEVICE=${{ matrix.device }} STUBS=1 RELEASE=1 all build/otatool-host
          [ "$(make -s version RELEASE=1)" = "${{ needs.version.outputs.version }}" ]
          # make leaves Wi-Fi motion's module out with a note when it cannot build it: a bundle must not lose it that way
          kmod=$(sed -n 's/^KMOD *:= *//p' devices/${{ matrix.device }}/device.mk)
          [ -z "$kmod" ] || [ -f build/${{ matrix.device }}/$kmod.ko ] || { echo "::error::$kmod.ko not built"; exit 1; }

      # The bundling as the release job does it, with a key of its own: checks the build is complete.  The release key
      # is not here: this job runs whatever code the branch or pull request brings.
      - name: Bundle (throwaway key)
        run: |
          mkdir -p secrets
          python3 scripts/otatool.py keygen secrets/throwaway.key secrets/throwaway.pub
          DEVICE=${{ matrix.device }} scripts/bundle.sh secrets/throwaway.key "${{ needs.version.outputs.version }}"
          # packed by the PC's otatool (Python), checked by the Echo's (C) as well
          for v in build/otatool-host "python3 scripts/otatool.py"; do
              $v verify secrets/throwaway.pub build/${{ matrix.device }}/hassmic.bundle build/${{ matrix.device }}/hassmic.bundle.sig
          done
      # what the bundle holds apart from its version: the release job publishes a beta only when it changed
      - name: Content ID
        run: DEVICE=${{ matrix.device }} scripts/content-id.sh STUBS=1 > build/${{ matrix.device }}.content-id
      # beside build/<device>/, not in it: the artifact's root is then build/ and it holds <device>/ itself, which the
      # release job needs (download-artifact puts a lone artifact's files straight into its path, without its name)
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.device }}
          path: |
            build/${{ matrix.device }}.content-id
            build/${{ matrix.device }}/hassmic
            build/${{ matrix.device }}/runas
            build/${{ matrix.device }}/otatool
            build/${{ matrix.device }}/latency
            build/${{ matrix.device }}/mixcap
            build/${{ matrix.device }}/mixplay
            build/${{ matrix.device }}/pryon_test
            build/${{ matrix.device }}/*.ko
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30                 # apt has hung for over 20 minutes: fail instead of waiting out the 6 h default
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # uv fetches Python and installs the wheels in parallel.  No cache: setup-uv prunes downloaded wheels from it in
      # CI anyway, since PyPI is as fast as restoring them.
      - uses: astral-sh/setup-uv@v10.2.0       # no major-version tags (v10) exist: the full version
        with:
          python-version: '3.13'
      # No ffmpeg (hundreds of packages; the one MP3 a test needs is testdata/sine440_24k.mp3), no recommends, and no
      # man-db trigger, which rebuilds the whole man database after an install.  This step took 1 to 10 minutes before.
      - name: Packages
        timeout-minutes: 8
        run: |
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus-dev libcurl4 netcat-openbsd sbc-tools
      - name: Python packages
        timeout-minutes: 5
        run: uv sync --locked           # .venv exactly as uv.lock says; fails if pyproject.toml changed without uv lock
      - name: Build
        run: make build/hassmic-host build/otatool-host
      - name: Unit tests
        run: make unit
      - name: otatool, Python against C
        run: sh tests/otatool_test.sh
      - name: Push updates
        run: sh tests/ota_push_test.sh
      - name: Online updates
        run: .venv/bin/python tests/fake_ha_update.py
      - name: ESPHome native API
        run: .venv/bin/python tests/fake_ha_esphome.py
      - name: Models copied between Echos
        run: .venv/bin/python tests/fake_web_artifacts.py
      - name: Wi-Fi switch from the settings page
        run: .venv/bin/python tests/fake_web_wifi.py
      - name: microWakeWord, models from the settings page
        run: .venv/bin/python tests/fake_web_mww.py
      - name: Setup from a phone (Improv over Bluetooth), factory reset
        run: .venv/bin/python tests/fake_improv.py

  release:
    needs: [version, build, test]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release                # the signing key; the environment admits main and release only
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: build
          pattern: build-*
          merge-multiple: true          # each holds <device>/ and <device>.content-id: build/ as the build jobs left it
      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "::error::secret RELEASE_SIGNING_KEY missing in the environment release"; exit 1; }
          make -s build/otatool-host
          mkdir -p secrets dist
          (umask 077; echo "$RELEASE_SIGNING_KEY" | base64 -d > secrets/release.key)
          for c in build/*.content-id; do
              d=${c#build/}; d=${d%.content-id}
              DEVICE=$d scripts/bundle.sh secrets/release.key "$VERSION"
              # signed by the PC's otatool (Python): what the Echo's (C) checks must pass too, or nothing is published
              for v in build/otatool-host "python3 scripts/otatool.py"; do
                  $v verify keys/release.pub build/$d/hassmic.bundle build/$d/hassmic.bundle.sig > /dev/null ||
                      { echo "::error::$d: bundle does not verify against keys/release.pub ($v): secret and public key differ, or the two otatools do"; rm -f secrets/release.key; exit 1; }
              done
              cp build/$d/hassmic.bundle dist/hassmic-$d.bundle; cp build/$d/hassmic.bundle.sig dist/hassmic-$d.bundle.sig
              cp $c dist/hassmic-$d.content-id
          done
          rm -f secrets/release.key
          [ "$(ls dist | wc -l)" = $(( 3 * $(ls build/*.content-id | wc -l) )) ] || { echo "::error::a bundle is missing"; ls -l dist; exit 1; }
          ls -l dist
      # A beta only when the Echos get something new: a commit that changes only CI, tests or the docs builds bundles
      # with the content IDs of the newest release (beta or not), and a beta of it would only make every Echo on the
      # beta channel download the same software again.  A push to release always publishes.
      - name: Anything new
        id: new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          new=true
          prev=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)
          if [ "$PRERELEASE" = true ] && [ -n "$prev" ] && gh release download "$prev" -p 'hassmic-*.content-id' -D prev 2>/dev/null; then
              same=true
              for f in dist/*.content-id; do cmp -s "$f" "prev/${f#dist/}" || same=false; done
              [ "$(ls prev | wc -l)" = "$(ls dist/*.content-id | wc -l)" ] || same=false        # a model added or dropped
              if [ $same = true ]; then new=false; echo "::notice::same content as $prev: no beta published"; fi
          fi
          echo "newest release: ${prev:-none}, publish: $new"
          echo "new=$new" >> "$GITHUB_OUTPUT"
      - name: Notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # what changed since the last release; for a beta, since the last beta or release
          prev=$(git tag -l 'v*' --sort=-creatordate | grep -vx "$TAG" | { [ "$PRERELEASE" = true ] && cat || grep -v -e '-beta$'; } | head -1)
          {
              if [ "$PRERELEASE" = true ]; then echo "Beta, from main ($(git rev-parse --short HEAD))."
              else echo "Release ($(git rev-parse --short HEAD))."; fi
              echo
              git log --no-merges --format='- %s' ${prev:+$prev..}HEAD | head -40
              echo
              echo "Install from Home Assistant: the Echo's \"Online updates\" select, then its firmware update entity. Bundles are signed with the release key (keys/release.pub)."
          } > notes.md
          cat notes.md; ls -l dist
      - name: Publish
        if: ${{ !env.ACT && steps.new.outputs.new == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then flags="--prerelease --latest=false" title="$VERSION (beta)"; else flags="--latest" title=$VERSION; fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$title" --notes-file notes.md $flags
      - name: Publish (act, dry run)
        if: ${{ env.ACT }}
        env:
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          NEW: ${{ steps.new.outputs.new }}
        run: |
          if [ "$NEW" = true ]; then echo "would create release $TAG (prerelease=$PRERELEASE) at $GITHUB_SHA with $(ls dist | tr '\n' ' ')"
          else echo "would publish nothing: same content as the newest release"; fi
