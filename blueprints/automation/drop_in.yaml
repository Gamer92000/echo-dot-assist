blueprint:
  name: Echo Drop In by voice
  description: >-
    "Drop in kitchen", "Verbinde mit der Küche", "Connecte-moi avec la cuisine"… on an Echo running hassmic calls the
    Echo in that area (or on that floor, or the one whose name has the word), as Alexa's Drop In did. The Echo you
    spoke to makes the call; end it with its action button, "<wake word>, stop" or "hang up" / "auflegen" /
    "raccroche" / "cuelga" / "riattacca" on either Echo. Drop In must be on in both Echos' settings pages (Features),
    and both must be in the same Echo network (the Echos section there). Sentences come for English, German, French,
    Spanish, Italian and Dutch; the reply is in the language of the voice assistant you spoke to (English where there
    is none below), and says why when there is no call. Renamed Echos and entities are found all the same.
  domain: automation
  source_url: https://github.com/Gamer92000/echo-dot-assist/blob/main/blueprints/automation/drop_in.yaml
  homeassistant:
    # "triggers:"/"actions:" and "trigger: conversation" are 2024.10's syntax
    min_version: "2024.10.0"
  input:
    sentences:
      name: Sentences
      description: >-
        What to say, in any language: Home Assistant matches them whatever language the assistant speaks. {room} is
        the area, floor or a word of the Echo's name to drop in on. Plain "call …" verbs are left out on purpose:
        they would catch requests meant for phone calls.
      default:
        # English
        - "drop in [on|at|in|to] [the] {room}"
        - "connect [me] (to|with) [the] {room}"
        # German
        - "drop in [bei|im|in der|in] {room}"
        - "(verbinde|verbinden) [mich] mit [dem|der|den] {room}"
        # French
        - "(connecte-moi|connecte moi|connecter) (à|a|avec) [la|le|les] {room}"
        # Spanish
        - "(conéctame|conectame|conecta) con [la|el|los|las] {room}"
        # Italian
        - "(collegami|connettimi|collega) con [la|il|lo] {room}"
        # Dutch
        - "(verbind|verbindt) [me|mij] met [de|het] {room}"
      selector:
        text:
          multiple: true
    replies:
      name: Replies
      description: >-
        Per language (the first part of the assistant's language: "de" for "de-CH" too), in this order: the call
        starts; there is no Echo there; the one you spoke to cannot call (not an Echo running hassmic, or Drop In off
        on it); the call did not start; the Echo called is in a call already; the one you spoke to is in a call
        already; Drop In is off on the Echo called; the Echo called is offline; the place named is the Echo's own.
        {room} is replaced by the area, floor or Echo found, or by what you said. A list with fewer entries (set
        before some of these came) takes the English one for the rest.
      default:
        en: ["Calling {room}", "There is no Echo in {room}", "Only an Echo with Drop In on can drop in",
             "The call to {room} did not go through", "{room} is in a call", "This Echo is in a call already",
             "Drop In is off on {room}", "{room} is offline", "This is the Echo in {room}"]
        de: ["Ich verbinde mit {room}", "Ich finde kein Echo für {room}", "Nur ein Echo mit eingeschaltetem Drop In kann verbinden",
             "Die Verbindung mit {room} kam nicht zustande", "{room} ist schon verbunden", "Dieses Echo ist schon verbunden",
             "Drop In ist aus bei {room}", "{room} ist offline", "Das ist das Echo in {room}"]
        fr: ["J'appelle {room}", "Je ne trouve pas d'Echo pour {room}", "Seul un Echo avec Drop In activé peut appeler",
             "L'appel vers {room} n'a pas abouti", "{room} est déjà en communication", "Cet Echo est déjà en communication",
             "Drop In est désactivé sur {room}", "{room} est hors ligne", "C'est l'Echo de {room}"]
        es: ["Llamando a {room}", "No encuentro ningún Echo en {room}", "Solo un Echo con Drop In activado puede llamar",
             "La llamada a {room} no se pudo hacer", "{room} ya está en una llamada", "Este Echo ya está en una llamada",
             "Drop In está desactivado en {room}", "{room} está desconectado", "Este es el Echo de {room}"]
        it: ["Chiamo {room}", "Non trovo nessun Echo per {room}", "Solo un Echo con Drop In attivo può chiamare",
             "La chiamata a {room} non è riuscita", "{room} è già in chiamata", "Questo Echo è già in chiamata",
             "Drop In è disattivato su {room}", "{room} non è in linea", "Questo è l'Echo di {room}"]
        nl: ["Ik verbind met {room}", "Ik vind geen Echo voor {room}", "Alleen een Echo met Drop In aan kan verbinden",
             "De verbinding met {room} kwam niet tot stand", "{room} is al in gesprek", "Deze Echo is al in gesprek",
             "Drop In staat uit op {room}", "{room} is offline", "Dit is de Echo in {room}"]
      selector:
        object:

triggers:
  - trigger: conversation
    command: !input sentences

# Rendered for every run, the conversation's and this automation's own call runs (below), which have no conversation:
# every read of the trigger has a default.  Each value goes through Home Assistant's result parser (literal_eval), so
# lists and mappings come back as such.
variables:
  replies: !input replies
  # for entries a hand-set list lacks (lists set before the later replies came have two or three)
  fallback: ["Calling {room}", "There is no Echo in {room}", "Only an Echo with Drop In on can drop in",
             "The call to {room} did not go through", "{room} is in a call", "This Echo is in a call already",
             "Drop In is off on {room}", "{room} is offline", "This is the Echo in {room}"]
  lang: >-
    {{ ((trigger.user_input | default({})).language | default('en', true) | string | lower
        | regex_replace('[-_].*$', '')) or 'en' }}
  words: >-
    {% set r = replies if replies is mapping else {} %}
    {% set w = r[lang] if lang in r else r['en'] if 'en' in r else [] %}
    {% set w = [w] if w is string else (w | list if w is iterable and w is not mapping else []) %}
    {{ w + fallback[w | count:] }}
  # what was said, without the punctuation speech-to-text puts around it
  room: >-
    {{ (trigger.slots | default({})).room | default('', true) | string | regex_replace('^\\W+|\\W+$', '') }}
  source: "{{ (trigger.device_id | default(none)) or '' }}"
  # Every hassmic Echo Home Assistant knows, with what the rest needs of it, found by what the Echo itself reports and
  # nobody renames.  Home Assistant takes manufacturer and model from the ESPHome project name when there is one
  # (components/esphome/manager.py async_get_manufacturer_model: "hassmic", "echo-dot-3"), else from the device info,
  # where hassmic says "Amazon" (issue #20).  Its "Drop In" sensor (listed only while Drop In is on) is the sensor
  # whose state is one of dropin.c's dropin_states, whatever its entity id; of several, the one with its icon
  # (mdi:phone-in-talk, kept while unavailable), then with an entity id ending in "drop_in" ("_2" and up: HA numbers
  # one that is taken).  Icon or entity id alone still count where the state cannot tell (unavailable, the sensor
  # disabled).  On any other device only all three make an Echo.  The devices: those of ESPHome entities, and of
  # every voice satellite (integration_entities first looks for a config entry titled "esphome", and takes only its
  # entities if there is one).
  echos: >-
    {% set ok = ['idle', 'calling', 'ringing', 'connected'] %}
    {% set ns = namespace(l=[]) %}
    {% set devs = (integration_entities('esphome') | list) + (states.assist_satellite | map(attribute='entity_id') | list) %}
    {% for d in devs | map('device_id') | reject('none') | unique | list %}
      {% set model = (device_attr(d, 'model') or '') | string | lower %}
      {% set hassmic = device_attr(d, 'manufacturer') in ['hassmic', 'Amazon'] or model in ['echo-dot-2', 'echo-dot-3', 'echo-2'] %}
      {% set b = namespace(sensor='', score=0) %}
      {% for e in device_entities(d) | select('match', 'sensor\\.') %}
        {% set s = (4 if states(e) in ok else 0) + (2 if state_attr(e, 'icon') == 'mdi:phone-in-talk' else 0)
                   + (1 if e is match('sensor\\..*drop_in(_[0-9]+)?$') else 0) %}
        {% if (s >= 4 or s % 2 == 1 or (hassmic and s >= 2)) and s > b.score %}{% set b.sensor = e %}{% set b.score = s %}{% endif %}
      {% endfor %}
      {% if hassmic or b.score == 7 %}
        {% set name = device_attr(d, 'name') or '' %}
        {% set shown = device_attr(d, 'name_by_user') or name %}
        {% set mac = namespace(v='') %}
        {% for c in device_attr(d, 'connections') or [] %}
          {% if c[0] == 'mac' %}{% set mac.v = c[1] | lower | regex_replace('[^0-9a-f]', '') %}{% endif %}
        {% endfor %}
        {# Its action: Home Assistant names an ESPHome action after the node name, '-' as '_' (manager.py
           build_service_name).  hassmic's node is its name slugged (main.c node_of), its name the model's and the MAC
           address's last three bytes (name_make: "Echo Dot 3 5695c4", node "echo-dot-3-5695c4").  So from the name
           Home Assistant keeps as the Echo reports it on every connection (device "name", not the one people give
           it), and from model and MAC address (tests/blueprint_dropin.py holds each board's project to the slug of
           its name).  They agree on every Echo with Drop In; the second is tried only where they do not. #}
        {% set by_name = name | lower | replace('ä', 'ae') | replace('ö', 'oe') | replace('ü', 'ue') | replace('ß', 'ss')
                         | replace('æ', 'ae') | replace('ø', 'o') | replace('þ', 'th') | replace('ð', 'd') | slugify %}
        {% set by_mac = (model ~ '_' ~ mac.v[-6:]) | slugify if model and mac.v | length == 12 else '' %}
        {% set actions = ([by_name] if by_name not in ['', 'unknown'] else [])
                         + ([by_mac] if by_mac not in ['', by_name] else []) %}
        {# where it is: its area and its entities' (a satellite put in another room) #}
        {% set ents = device_entities(d) %}
        {% set areas = ([area_id(d)] + (ents | map('area_id') | list)) | reject('none') | unique | list %}
        {% set floors = ([floor_id(d)] + (ents | map('floor_id') | list)) | reject('none') | unique | list %}
        {% set k = namespace(area=[], floor=[], name=[]) %}
        {% for x in areas | map('area_name') | reject('none') %}
          {% set k.area = k.area + [x | slugify, x | lower | replace('ä', 'ae') | replace('ö', 'oe') | replace('ü', 'ue') | replace('ß', 'ss') | slugify] %}
        {% endfor %}
        {% for x in floors | map('floor_name') | reject('none') %}
          {% set k.floor = k.floor + [x | slugify, x | lower | replace('ä', 'ae') | replace('ö', 'oe') | replace('ü', 'ue') | replace('ß', 'ss') | slugify] %}
        {% endfor %}
        {% for x in [shown, name] if x %}
          {% set k.name = k.name + [x | slugify, x | lower | replace('ä', 'ae') | replace('ö', 'oe') | replace('ü', 'ue') | replace('ß', 'ss') | slugify] %}
        {% endfor %}
        {% set ns.l = ns.l + [{'id': d, 'shown': shown, 'sensor': b.sensor, 'state': states(b.sensor) if b.sensor else '',
                               'actions': actions, 'call': name or (model ~ '-' ~ mac.v[-6:]), 'areas': areas, 'floors': floors,
                               'area_keys': k.area | reject('in', ['', 'unknown']) | unique | list,
                               'floor_keys': k.floor | reject('in', ['', 'unknown']) | unique | list,
                               'name_keys': k.name | reject('in', ['', 'unknown']) | unique | list}] %}
      {% endif %}
    {% endfor %}
    {{ ns.l | sort(attribute='shown') }}
  src: "{{ echos | selectattr('id', 'eq', source) | list | first | default(none) }}"
  # Which Echo is meant, by the first of these that names any (the Echo spoken to included: "drop in kitchen" said in
  # the kitchen does not call another Echo by a weaker match): the area (Home Assistant's lookup, which knows its
  # aliases and ignores case and spaces; else spelled the same without accents, ü or ue alike), the Echo's name, the
  # floor, then a word of its name, or its area as a word of what was said ("kitchen please").  Of several, the one
  # with Drop In that is idle before one in a call, offline or without Drop In.
  pick: >-
    {% set rk = [room | slugify, room | lower | replace('ä', 'ae') | replace('ö', 'oe') | replace('ü', 'ue') | replace('ß', 'ss') | slugify]
                | reject('in', ['', 'unknown']) | unique | list %}
    {% set ra = area_id(room) if room else none %}
    {% set rf = floor_id(room) if room and not ra else none %}
    {% set hit = namespace(tier=0, list=[]) %}
    {% for tier in [1, 2, 3, 4] %}
      {% if rk and not hit.list %}
        {% for e in echos %}
          {% set w = namespace(name=false, area=false) %}
          {% for r in rk %}
            {% if e.name_keys | select('search', '(^|_)' ~ r ~ '(_|$)') | list %}{% set w.name = true %}{% endif %}
            {% for a in e.area_keys %}{% if ('_' ~ a ~ '_') in ('_' ~ r ~ '_') %}{% set w.area = true %}{% endif %}{% endfor %}
          {% endfor %}
          {% if (tier == 1 and ((ra and ra in e.areas) or rk | select('in', e.area_keys) | list))
                or (tier == 2 and rk | select('in', e.name_keys) | list)
                or (tier == 3 and ((rf and rf in e.floors) or rk | select('in', e.floor_keys) | list))
                or (tier == 4 and (w.name or w.area)) %}
            {% set hit.tier = tier %}{% set hit.list = hit.list + [e] %}
          {% endif %}
        {% endfor %}
      {% endif %}
    {% endfor %}
    {% set best = namespace(e=none, rank=9) %}
    {% for e in hit.list if e.id != source %}
      {% set rank = 4 if not e.sensor else 0 if e.state == 'idle' else 1 if e.state in ['', 'unknown']
                    else 3 if e.state == 'unavailable' else 2 %}
      {% if rank < best.rank %}{% set best.e = e %}{% set best.rank = rank %}{% endif %}
    {% endfor %}
    {% set e = best.e or (hit.list | selectattr('id', 'eq', source) | list | first | default(none)) %}
    {% if e %}
      {# what the reply calls it: the area or floor that matched, as Home Assistant spells it, else its name #}
      {% set m = namespace(said=e.shown or room) %}
      {% for x in (e.areas | map('area_name') | list if hit.tier in [1, 4] else e.floors | map('floor_name') | list if hit.tier == 3 else [])
              | reject('none') | list | reverse %}
        {% for kx in [x | slugify, x | lower | replace('ä', 'ae') | replace('ö', 'oe') | replace('ü', 'ue') | replace('ß', 'ss') | slugify] %}
          {% for r in rk %}
            {% if kx == r or (hit.tier == 4 and ('_' ~ kx ~ '_') in ('_' ~ r ~ '_')) %}{% set m.said = x %}{% endif %}
          {% endfor %}
        {% endfor %}
      {% endfor %}
      {% set said = area_name(ra) if hit.tier == 1 and ra in e.areas else floor_name(rf) if hit.tier == 3 and rf in e.floors
                    else m.said %}
      {{ {'id': e.id, 'said': said | string, 'sensor': e.sensor, 'state': e.state, 'call': e.call, 'self': not best.e} }}
    {% else %}
      {{ none }}
    {% endif %}
  said: "{{ pick.said if pick else room }}"

# No conditions: an automation that stops without a reply makes Home Assistant say "Done", so every way out of the
# actions sets one.
actions:
  # This automation's own call runs (automation.trigger below, with dropin_call): the Echo's action and nothing else.
  # An action Home Assistant does not know raises ServiceNotFound, which continue_on_error does not catch
  # (helpers/script.py CONFIGURATION_ERRORS); in the conversation's run it would end the run without a reply ("Done").
  # Here it ends this run only: automation.trigger waits for it, and the automation catches what it raises
  # (components/automation async_trigger; a repair names the action).  The conversation's run sees the call start on
  # the Echo's "Drop In" sensor.
  - if: "{{ dropin_call is defined }}"
    then:
      - action: "{{ dropin_call.action }}"
        data:
          target: "{{ dropin_call.target }}"
      - stop: Drop In action called
  - choose:
      - conditions: "{{ not src or not src.sensor or not src.actions }}"
        sequence:
          - set_conversation_response: "{{ words[2] | replace('{room}', said) }}"
      - conditions: "{{ not pick }}"
        sequence:
          - set_conversation_response: "{{ words[1] | replace('{room}', said) }}"
      - conditions: "{{ pick.self }}"
        sequence:
          - set_conversation_response: "{{ words[8] | replace('{room}', said) }}"
      - conditions: "{{ not pick.sensor }}"
        sequence:
          - set_conversation_response: "{{ words[6] | replace('{room}', said) }}"
      - conditions: "{{ src.state in ['calling', 'ringing', 'connected'] }}"
        sequence:
          - set_conversation_response: "{{ words[5] | replace('{room}', said) }}"
      - conditions: "{{ pick.state in ['calling', 'ringing', 'connected'] }}"
        sequence:
          - set_conversation_response: "{{ words[4] | replace('{room}', said) }}"
    # The call.  hassmic's "Drop In" goes to calling as it takes the action (dropin.c dropin_call), to connected when
    # the other Echo answers (milliseconds: both waits end at once), stays at calling while that one rings (Drop In
    # answers: after the action button; its own sensor says ringing), and goes back to idle when it refuses (do not
    # disturb, microphones off, in a call: its log says why) or says nothing for 4 s (ANSWER_MS).  A quick refusal can
    # come before Home Assistant hears "calling" (hassmic's loop reports the state it finds then): the first wait then
    # runs out, after as long as hassmic waits for an answer, and the reply is the same.  Under the second action name
    # only if the first did not reach the Echo, which happens only where the two differ.  With the sensor disabled
    # there is nothing to wait for.  Each wait's result is read in the sequence of the wait: Home Assistant before
    # 2025.4 kept variables set in a nested sequence there.
    default:
      - repeat:
          sequence:
            - variables:
                call_action: "esphome.{{ src.actions[repeat.index - 1] }}_drop_in"
            - if: "{{ this is defined and this and this.entity_id is defined }}"
              then:
                - action: automation.trigger
                  target:
                    entity_id: "{{ this.entity_id }}"
                  data:
                    skip_condition: true
                    variables:
                      dropin_call:
                        action: "{{ call_action }}"
                        target: "{{ pick.call }}"
                  continue_on_error: true
              else:
                - action: "{{ call_action }}"
                  data:
                    target: "{{ pick.call }}"
                  continue_on_error: true
            - wait_template: "{{ src.state != 'idle' or is_state(src.sensor, ['calling', 'ringing', 'connected']) }}"
              timeout: 4
              continue_on_timeout: true
            - variables:
                sent: "{{ wait.completed }}"
            - wait_template: >-
                {{ not sent or src.state != 'idle' or not is_state(src.sensor, 'calling') or is_state(pick.sensor, 'ringing') }}
              timeout: 5
              continue_on_timeout: true
            - variables:
                ok: "{{ sent and (src.state != 'idle' or is_state(src.sensor, ['calling', 'ringing', 'connected'])) }}"
            - set_conversation_response: >-
                {{ (words[0] if ok else words[7] if is_state(pick.sensor, 'unavailable')
                    else words[4] if is_state(pick.sensor, ['calling', 'ringing', 'connected']) else words[3])
                   | replace('{room}', said) }}
          until: "{{ (sent is defined and sent) or repeat.index >= src.actions | count }}"
mode: parallel
max: 25
