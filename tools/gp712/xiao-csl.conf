# The CSL child for the Echo 4's tests (PLAN.md "Thread 1.4" 2.1, 2b.3): NCS's OpenThread CLI sample (xiao-build.sh),
# a Seeed XIAO nRF52840 (board xiao_ble), its console the USB CDC ACM port.  A synchronized sleepy end device
# (MTD, rx-off-when-idle by `ot mode -`) that asks its parent for CSL (`ot csl period <us>`), Thread 1.4.
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_MTD_SED=y
CONFIG_OPENTHREAD_THREAD_VERSION_1_4=y
CONFIG_OPENTHREAD_CSL_RECEIVER=y
CONFIG_OPENTHREAD_LINK_METRICS_INITIATOR=y
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_SLAAC=y
# The log stays on the shell (the only backend: without one Zephyr's log core asserts 4.3 s after every start, a
# reboot loop; LOG itself is OpenThread's to select): tools/gp712/xiaobridge.py reads the port all the time
# a fatal error: xiao-module/fatal.c keeps what it was ("lastfatal" says it) and resets (NCS's own handler off)
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_HW_STACK_PROTECTION=y
CONFIG_ASSERT=y
# OpenThread built from its sources (the sample's prebuilt library is an FTD's), no GPIO shell
CONFIG_OPENTHREAD_SOURCES=y
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MASTER=n
CONFIG_GPIO_SHELL=n
