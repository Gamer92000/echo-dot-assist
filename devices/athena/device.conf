# Echo Show 8 2nd gen 2021 (athena), Fire OS 7574.1 (PS75741.7080N, build 7080).  Shell syntax, no commands: sourced by the
# PC scripts (scripts/lib/device.sh) and, shipped next to them, by the scripts on the Echo.
# Android 9 (SDK 28) on an MT8183, 32-bit userland, kernel 4.4.146, Treble (/vendor is a partition of its own), system as
# root, not A/B, dm-verity off once rooted, SELinux enforcing with the policy in /vendor/etc/selinux/precompiled_sepolicy.
# Full Android: Alexa is a set of apps, Wi-Fi is WifiService, as on checkers and crown.  docs/re-athena.md.

# --- identity: what the connected Echo must report before anything is written to it
MODEL_NAME="Echo Show 8 2nd gen (2021)"
MODEL_NUMBER=A8H3N2                       # the label on the Echo Show 8 2nd gen (shown by setup.sh beside the model)
PRODUCT=athena                            # ro.product.device
FIRMWARE_ID=PS75741.7080N                 # ro.build.display.id
FIRMWARE_FILE=update-kindle-athena-PS75741_user_7080_0036274153604.bin
FIRMWARE_SHA256=7a76fe6f84847c183e617fe6bb0c311faa9ad5ab56803b3a6115fb763c422a1a
DEFAULT_ARGS=""
# stock files that must be byte-identical to firmware/$DEVICE/rootfs/system (scripts/probe.sh): the wake word engine and
# where the front end lives (libasp in /vendor, the audio HAL, audioflinger, the binder client), and stock's wake word service
PROBE_FILES="lib/libpryon.so vendor/lib/libasp.so lib/libaspclient.so lib/libaudioflinger.so vendor/lib/hw/audio.primary.mt8183.so lib/libwakewordserver_jni.so"

FIRMWARE_BUILD=0036274153604              # ro.build.version.incremental
# --- installation: the Echo is rooted from the running OS by the unlock's TWRP zip (devices/athena/unlock.md): system and
# vendor patched in place (ro.secure 0, adbd, the policy in /vendor/etc/selinux, OTA blocked), no boot image of ours.
# INSTALL=running: scripts/install-system.sh writes /system and the vendor policy from that running OS (sysinstall.sh).
INSTALL=running
SEPOLICY_FILE=/vendor/etc/selinux/precompiled_sepolicy
# magiskpolicy (32-bit ARM, bionic) of the unlock's boot-root.zip, patch/magiskpolicy32: run on the Echo itself
SEPOLICY_TOOL=firmware/athena/boot-root/patch/magiskpolicy32

# --- the daemon's user: no AIPC for audio here.  Not root: hassmic faces the network.  Groups: bluetooth for /dev/stpbt
# (ueventd: bluetooth:bluetooth 0660), input for the keys
DAEMON_USER=system
DAEMON_GROUPS=system,audio,inet,input,bluetooth

# --- Wi-Fi: the framework owns the networks (as checkers).  Android 9 shows the SSID and the scan results only to a
# system uid and wants the caller's package name ("android"), so wifictl.dex runs as this user (wifi.sh, wifi-join.sh)
WIFICTL_USER=system

# --- stock: Alexa is Android apps, started by the framework, not init (see devices/crown/device.conf for how the lists
# work).  Alexa's client apps are disabled with pm, Amazon's apps leave the partition (STOCK_APPS_OUT), the home screen is
# hassmic's.  Amazon's home screen (ambienthome, paladin) and whad as on crown: with only Alexa's apps off, ambienthome
# crashed and covered the screen (docs/re-athena.md), until the install takes them off the partition.
ALEXA_PROP=
ALEXA_SERVICES="ahe"
ALEXA_PACKAGES="amazon.speech.sim com.amazon.bishop com.amazon.device.echoaudioservice com.amazon.afe.app com.amazon.alexa.awaservice com.amazon.ambienthome com.amazon.alexa.ms.kinex com.amazon.alexadirectivebrokerservice com.amazon.alexa.datastore.app com.amazon.NativeAccessorProxyServices com.amazon.paladin com.amazon.whad com.amazon.d3 com.amazon.a4b.mcc com.amazon.csm.htmlruntime"
# Stock apps taken off the system partition (sysinstall.sh; back at uninstall), as crown's list (docs/re-crown.md has why):
# every Amazon app of /system/app and priv-app but the shared libraries of /system/etc/permissions (Settings and
# FusedLocation fail to load without them), System UI and Amazon's Settings among them, plus what only worked with Amazon's
# identity libraries; AOSP's own, the WebView, the Wi-Fi profile manager and the download provider stay.  Launcher3QuickStep
# (Android's launcher) goes too: hassmic's own home screen is the only HOME then.  Of 101 of crown's 113 entries athena has
# the same folder; the rest are what athena's Amazon apps add (computed 2026-10-14, to confirm by what crashes).
STOCK_APPS_OUT="
