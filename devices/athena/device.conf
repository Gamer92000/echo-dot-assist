HOME_APK=hassmic-home.apk
# Android's settings for a satellite (alexa-off.sh, "namespace/key=value"; old values back with alexa-on.sh).  Android's
# Bluetooth off: /dev/stpbt is hassmic's (raw HCI), and the HIDL Bluetooth HAL (BT_SERVICE) holds the node otherwise
# ("mode is 3" in dmesg, open() fails with ENOENT, 2026-10-14)
ANDROID_SETTINGS="system/screen_off_timeout=300000 global/bluetooth_on=0 system/screen_brightness_mode=0 system/screen_brightness=120"
SCREEN_BAND=1
# a kernel wake lock root's main.sh holds while the satellite runs: with the screen off Android lets the SoC suspend
# once no wake lock is held (/sys/power/autosleep), and the satellite must keep listening
WAKE_LOCK=hassmic
# firmware updates: apps with a sharedUserId of their own (the firewall cuts their uid off)
UPDATE_SERVICES=
UPDATE_PACKAGES="com.amazon.device.software.ota com.amazon.device.software.ota.override"
UPDATE_ONDEMAND=
CLOUD_SERVICES="trackerd whad_cc neo-init neo-coordinator shchipd shblemeshd shlocalskillsd smarthomewifid meshmgrservice inlocservice perfmonitord"
BT_SERVICE=bluetooth-1-0
UX_SERVICE=
SETUP_SERVICES=
SETUP_PACKAGES="com.amazon.amasetup.service com.amazon.kindle.otter.oobe"
# Wi-Fi belongs to Android's WifiService in system_server; wpa_supplicant runs -O/data/vendor/wifi/wpa/sockets (vendor's
# init rc); wifi.sh goes through wifictl.dex here, not wpa_cli
WIFI_SERVICE=
WLAN=wlan0
WPA_SOCKETS=/data/vendor/wifi/wpa/sockets

# --- Wi-Fi motion: our module reads every frame's RCPI from the driver (src/kmod/hassmic_rcpi4m.c, device.mk); main.sh
# loads it only once Wi-Fi motion is switched on.  KMOD_ARGS: module parameters for another driver build.
KMOD=hassmic_rcpi4m.ko
KMOD_ARGS=""

# --- firewall: no stock firewall.sh here; netd's chains and ACCEPT policies otherwise (iptables -S on the Echo, 2026-10-14).
# What lockdown.sh's keep needs beyond its own list, worded as "iptables -S" prints it, ";" between rules: DHCP answers
# (to the broadcast address, so conntrack does not take them for replies)
FW_KEEP="INPUT -i wlan0 -p udp -m udp --sport 67 --dport 68 -j ACCEPT"
