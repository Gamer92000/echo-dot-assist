# Echo Spot 1st gen 2017 (rook), Fire OS 5.5.6.9 (304.6.9.0, 690918120).  Shell syntax, no commands: sourced by the PC
# scripts (scripts/lib/device.sh) and, shipped next to them, by the scripts on the Echo.
# MT8163 like checkers and crown, but Android 5.1.1 (API 22, the Knight family of the Echo Show 1st gen), an aarch64 kernel
# (3.18.19) under a 32-bit userland, a Broadcom Wi-Fi and Bluetooth, a round 480x480 screen.  Facts probed over adb on a
# running Echo Spot (2026-11-20); everything below marked "verify" is copied from crown and not tried on a rook yet.

# --- identity: what the connected Echo must report before anything is written to it
MODEL_NAME="Echo Spot 1st gen (2017)"
MODEL_NUMBER=VN94DQ                       # the label on the Echo Spot 1st gen
PRODUCT=rook                              # ro.product.device
# ro.build.display.id is LVY48F on every 5.5.x build of rook (5.5.5.6 -> 5.5.6.9 differ in libpryon, libasp, libaudioflinger
# ...), so the build is told apart by ro.build.version.incremental (FIRMWARE_BUILD) and probe.md5
FIRMWARE_ID=LVY48F
FIRMWARE_FILE=update-kindle-rook-304.6.9.0_user_690918120.bin
FIRMWARE_SHA256=616db16df6b1b8a94fa756e8aa970dd4f062c61d1d0d816c34807417f85cb5aa
FIRMWARE_BUILD=304.6.9.0_user_690918120   # ro.build.version.incremental
DEFAULT_ARGS=""
# stock files that must be byte-identical to firmware/$DEVICE/rootfs/system (scripts/probe.sh): the wake word engine and
# where the front end lives (audio HAL, audioflinger, the binder client), and stock's wake word service
PROBE_FILES="lib/libpryon.so lib/libasp.so lib/libaspclient.so lib/libaudioflinger.so lib/libwakewordserver_jni.so"

# --- installation: verify.  Not A/B (one system partition), no boot image written yet by anything of ours.
INSTALL=boot
# Android 5.1's init reads rc files from the boot ramdisk only (7.0's also /system/etc/init, where the other Shows' hassmic.rc
# goes): mkbootroot.py appends hassmic.rc to this ramdisk file (install-boot.sh); the copy sysinstall.sh puts in /system/etc/init
# is then not read
RAMDISK_RC=init.rook.rc
# Android's framework runs (WifiService has the Wi-Fi: wifictl.dex): the scripts ship and use it
ANDROID=1
BOOT_SHA256=a80a5e9dc750863fdda0edad423a43e18156c8be831eb933e0ddac865fc41f8a   # boot.img in FIRMWARE_FILE
BOOT_DEV=/dev/block/platform/mtk-msdc.0/by-name/boot
SYSTEM_DEV=/dev/block/platform/mtk-msdc.0/by-name/system
# the system partition as 304.6.9.0 leaves it: tools/sdat2img.py of FIRMWARE_FILE's system.new.dat (reproducible), 1744723968
# bytes of the partition's 1744830464 (the rest is not part of the image).  Written from TWRP with dd, as crown's setup does
SYSTEM_IMG_SHA256=f14d04930d52db5127e272e4a268293721433f0c1faaff981c29c87a4ce8da67
# magiskpolicy (32-bit ARM, bionic) runs on the PC under qemu-arm (tools/qrun.sh) against a rootfs: rook's own Android 5.1 linker
# has no DT_GNU_HASH support and cannot start it, so SEPOLICY_ROOTFS names another model's unpacked firmware (any Fire OS 6 / Android 7+
# one: crown's, checkers', donut's).  Only its linker and libc/libm/libdl are used; the policy patched is rook's own
SEPOLICY_ROOTFS=firmware/crown/rootfs
SEPOLICY_TOOL=firmware/rook/magiskpolicy32
SEPOLICY_TOOL_SHA256=e5fafc1fa9486950ce9ba476f5723754d260014515ced72b4560238e6c560f3a
# adbd for the ramdisk: 304.6.9.0's own is a user build and never stays root (scripts/mkbootroot.py --adbd); this is sbin/adbd
# of the boot-root.img that amonet's crown thread supplies (CyanogenMod's, static, goes by ro.secure; byte-identical to
# checkers').  Root in su with it on a crown, 2026-10-13
ADBD=firmware/rook/adbd
ADBD_SHA256=108ba4032081ede6e2a5fbad3eeafa6d90948b93fe799f3e76555327f0f041ad

# --- the daemon's user: no AIPC for audio here.  AudioFlinger (libserviceutility.so recordingAllowed) lets root record
# without a package, any other uid only with one; system has "android".  Not root: hassmic faces the network.
# net_bt_stack for /dev/stpbt, input for the keys.  verify on the device
DAEMON_USER=system
DAEMON_GROUPS=system,audio,inet,input,net_bt_stack

# --- stock: Alexa is Android apps, started by the framework, not init: alexa-off.sh disables these with pm (and
# alexa-on.sh enables them again).  Many more apps carry Alexa's client library (paladin, the home screen, too); only
# those that fail without Alexa are listed.  NativeAccessorProxyServices (Alexa's bridge for native daemons) crashed
# with "Client already torn down!" once amazon.speech.sim was off, a "has stopped" dialog on the screen (2026-10-13).
# The screen is a satellite's, not Amazon's: Amazon's home screen (paladin, which needs amazon.speech.sim as well) and
# the apps that crashed in a loop after the install go too (whad 33 times in a minute, "Invalid CommonClock"; cardinal,
# alexa.datastore.app).  HOME is then Settings' FallbackHome: a blank screen.  Settings itself stays (FallbackHome is
# in it), but not its SettingsInitializationHelperService: once setup counts as complete it looks for the
# preference-settings.json a setup with Amazon would have downloaded, and crashed at every boot.
ALEXA_PROP=
ALEXA_SERVICES="ahe dacd"
# The last entry is a component of Settings (which stays): its boot-time init service reads Amazon's device config bundle, which
# an unregistered Echo never unpacked ("null/preference-settings.json"), and crashed into a "Settings has stopped" dialog at every boot.
ALEXA_PACKAGES="amazon.speech.sim com.amazon.bishop com.amazon.device.echoaudioservice com.amazon.afe.app com.amazon.alexa.awaservice com.amazon.ambienthome com.amazon.d3 com.amazon.NativeAccessorProxyServices com.amazon.paladin com.amazon.whad com.amazon.cardinal com.amazon.alexa.datastore.app com.amazon.a4b.conferencing.chime com.amazon.a4b.mcc com.amazon.csm.htmlruntime com.android.settings/com.amazon.settings.device.SettingsInitializationHelperService"
# Stock apps taken off the system partition altogether (sysinstall.sh, at install and with every update that becomes
# the factory copy; back at uninstall): paths under /system, kept in /system/hassmic-removed, where PackageManager does
# not look.  pm disable does not control them: Fire OS enables System UI again at the next boot, and starts its
# persistent apps at boot even disabled (amazon.speech.sim, whad, NativeAccessorProxyServices ran again with enabled=2,
# 2026-10-13).  So every Amazon app of /system/app and /system/priv-app (pm list packages -f on the first Echo Show:
# com.amazon.*, amazon.*, Ivona TTS, Arcus, the usage stats proxy, Sidewalk), System UI and Amazon's Settings among them
# (Settings cannot start without Amazon's account apps: "No central apk detected", CountryHelper throws), but not the
# ones whose APK is a shared library declared in /system/etc/permissions (amazon.jackson-19, com.amazon.communication,
# com.amazon.device.sync.sdk.internal, com.amazon.diode.eventsender, DeviceMessagingAndroid[Internal]SDK,
# DeviceSoftwareOTAContracts, MetricsApi, MinervaApi, RealtimeRegistryDeviceSDK): with them gone, FusedLocation (in
# system_server) and Settings failed to load, system_server restarted in a loop.  Stay too: Android's own, amazon.fireos
# (framework/fireos-res) and the vendor Wi-Fi profile manager.  Home is then hassmic's (HOME_APK).
# crown's last three entries: they load Amazon's identity library (MAPInit), which is gone with the other Amazon apps, and crash:
# the middleware in a loop every second (load average 9.6 on the first boot, 2026-10-14), the metrics service at start
# rook: System UI only (Fire OS 5.5's SystemUI, priv-app/SystemUI).  It waits ten minutes for Amazon's Alexa client (amazon.speech.sim, off
# here) and then dies with "SimClient was never got created", a "System UI has stopped" dialog on the screen every ten minutes
# (2026-11-20); pm disable does not stop a persistent app.  tcomm ("Amazon Communication Services") dies once at every boot,
# when HA sets the clock ("WakeLock under-locked"), a dialog whose button the light band's rows cover; its helper goes with it
# (cupcake's list has both).  com.amazon.communication stays: permissions/tcomm.xml declares it a system library.  The rest of crown's list was not checked against rook's firmware (a
# wrong entry sends system_server into a restart loop): Amazon's other apps are only disabled with pm, which alexa-on.sh undoes.
STOCK_APPS_OUT="priv-app/SystemUI priv-app/com.amazon.tcomm priv-app/com.amazon.tcomm.jackson"
# hassmic's home screen (tools/mkhome.py: no code, android.app.Activity, black): sysinstall.sh puts it in /system/app
HOME_APK=hassmic-home.apk
# Android's settings for a satellite (alexa-off.sh, "namespace/key=value"; old values back with alexa-on.sh): the screen
# off after 5 min as stock's (hassmic's light band keeps it there, 1 min with the mic off or in Do not disturb: ring_band.c;
# stock had 24 days with the camera off, the backlight at 238 of 255 all the time); Android's
# Bluetooth off (its app is off the partition too: /dev/stpbt is hassmic's, raw HCI as on the Dots: hciscan on the
# first Echo Show, 2026-10-13: reset, address 7c:d5:66:97:f7:7b, 315 LE adverts in 8 s once Android's stack let go)
# smartconn_status "enabled": the one switch Amazon's WifiDiagsUtil and its NetWatchDog (fosservices) both skip their Wi-Fi
# resets for (rook's fosservices has the setting, 2026-11-20): without it the Echo's Wi-Fi was bounced behind the egress lock
# ("CaptivePortalTestFailed" ... wifi-framework-disconnect, 2026-11-20), the link to Home Assistant dropped and a new lease
# came.  captive_portal_detection_enabled 0: Android 5.1's name for what 6.0 calls captive_portal_mode (services.odex has the
# first, no firmware file the second): NetworkMonitor then takes the network as validated without probing Amazon's hosts
ANDROID_SETTINGS="system/screen_off_timeout=300000 global/bluetooth_on=0 system/screen_brightness_mode=0 system/screen_brightness=120 system/accelerometer_rotation=0 system/user_rotation=1 system/smartconn_status=enabled global/captive_portal_detection_enabled=0"
# what stops WifiDiagsUtil's tests themselves (main.sh android_tell); rook's fosservices has both receivers (2026-11-20)
ANDROID_BROADCASTS="com.amazon.android.service.wifidiags.SET_ENABLENETBOUNCE/val=false com.amazon.android.service.wifidiags.SET_ENABLEWIFIDIAGS/val=false"
# the light band at the bottom of the screen (ring_band.c, ringbar.dex) reserves its rows with the window manager's
# overscan, which Android keeps in /data/system/display_settings.xml: alexa-on.sh gives them back
SCREEN_BAND=1
# a kernel wake lock root's main.sh holds while the satellite runs: with the screen off Android lets the SoC suspend
# once no wake lock is held (/sys/power/autosleep), and the satellite must keep listening
WAKE_LOCK=hassmic
# firmware updates: an app with a sharedUserId of its own (not used yet: the firewall must cut its uid off)
UPDATE_SERVICES=
UPDATE_PACKAGES="com.amazon.device.software.ota"
UPDATE_ONDEMAND=
CLOUD_SERVICES="trackerd whad_cc quantum neo-init neo-coordinator shchipd shblemeshd shlocalskillsd smarthomewifid meshmgrservice inlocservice perfmonitord"
BT_SERVICE=
UX_SERVICE=
SETUP_SERVICES=
SETUP_PACKAGES="com.amazon.amasetup.service com.amazon.kindle.otter.oobe"
# Wi-Fi belongs to Android's WifiService in system_server; wpa_supplicant runs -O/data/misc/wifi/sockets -g@android:wpa_wlan0
WIFI_SERVICE=
WLAN=wlan0
WPA_SOCKETS=/data/misc/wifi/sockets

# --- Wi-Fi motion: none (Broadcom bcmdhd: no module of ours hooks its receive path, device.mk builds none)
KMOD=
KMOD_ARGS=""

# --- firewall: no stock firewall.sh here; netd's chains and ACCEPT policies otherwise.  What lockdown.sh's keep needs
# beyond its own list, worded as "iptables -S" prints it, ";" between rules: DHCP answers (to the broadcast address,
# so conntrack does not take them for replies)
FW_KEEP="INPUT -i wlan0 -p udp -m udp --sport 67 --dport 68 -j ACCEPT"
