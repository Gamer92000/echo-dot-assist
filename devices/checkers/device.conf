# Echo Show 5 1st gen 2019 (checkers), Fire OS 6574.1 (NS65741), the same release as donut's.  Shell syntax, no commands:
# sourced by the PC scripts (scripts/lib/device.sh) and, shipped next to them, by the scripts on the Echo.
# Worked out from the firmware only (docs/re-checkers.md); nothing here has run on an Echo Show yet.
# checkers is a full Android device: Alexa is a set of apps, Wi-Fi is Android's WifiService, iptables belongs to netd.
# The on-device scripts (main.sh, lockdown.sh, alexa-off.sh, wifi.sh) do not handle that yet; the variables marked
# "not used yet" say what they will need.

# --- identity: what the connected Echo must report before anything is written to it
MODEL_NAME="Echo Show 5 1st gen (2019)"
MODEL_NUMBER=H23K37
PRODUCT=checkers                         # ro.product.device: no _puffin suffix on this one
FIRMWARE_ID=NS65741
FIRMWARE_FILE=update-kindle-checkers-NS65741_user_8149_0013222532484.bin
FIRMWARE_SHA256=f96fcfa1240f809711fcf855ce7742762437e4f37546153153635c096773cfa3
DEFAULT_NAME="Echo Show"
DEFAULT_ARGS="-B"                        # no Bluetooth: Android's stack owns the controller (com.android.bluetooth)
# stock files that must be byte-identical to firmware/$DEVICE/rootfs/system (scripts/probe.sh): the wake word engine and
# where the front end lives (audio HAL, audioflinger, the binder client), and stock's wake word service
PROBE_FILES="lib/libpryon.so lib/libasp.so lib/libaspclient.so lib/libaudioflinger.so vendor/lib/hw/audio.primary.mt8163.so lib/libwakewordserver_jni.so"

FIRMWARE_BUILD=0013222532484            # ro.build.version.incremental: the boot image is built from this build's own
# --- installation (scripts/install-boot.sh): not A/B (one system partition, dm-verity "verify" in fstab.mt8163), the
# policy in the boot ramdisk.  The boot image is 8149's own with root adb, without verify, and with the policy patched
# for adb and our services (scripts/mkbootroot.py, sepolicy.rules), flashed in amonet's hacked fastboot; then the files go
# onto /system from the running OS, as on donut.  Only boot and system are ever written.
INSTALL=boot
BOOT_SHA256=7063e380f811f4792d7d9b3b1577e46f580c194fde89b9842063eef40d47c5d6   # boot.img in FIRMWARE_FILE
BOOT_DEV=/dev/block/platform/mtk-msdc.0/11230000.MSDC0/by-name/boot
SYSTEM_DEV=/dev/block/platform/mtk-msdc.0/11230000.MSDC0/by-name/system
# magiskpolicy (32-bit ARM, bionic) from donut's boot-root.zip, patch/magiskpolicy32; run on the PC under qemu-arm against
# firmware/checkers/rootfs (tools/qrun.sh): the policy is patched before the Echo has root
SEPOLICY_TOOL=firmware/checkers/magiskpolicy32
SEPOLICY_TOOL_SHA256=e5fafc1fa9486950ce9ba476f5723754d260014515ced72b4560238e6c560f3a
# adbd for the ramdisk: 8149's own is a user build and never stays root (scripts/mkbootroot.py --adbd); this is sbin/adbd
# of the XDA image in checkers' own boot-root.zip (CyanogenMod's, static, goes by ro.secure).  Root in su with it on a
# checkers, 2026-10-10
ADBD=firmware/checkers/adbd
ADBD_SHA256=108ba4032081ede6e2a5fbad3eeafa6d90948b93fe799f3e76555327f0f041ad

# --- the daemon's user: no AIPC for audio here.  AudioFlinger (libserviceutility.so recordingAllowed) lets root record
# without a package, any other uid only with one; system has "android".  Not root: hassmic faces the network.
# net_bt_stack for /dev/stpbt, input for the keys.  verify on the device
DAEMON_USER=system
DAEMON_GROUPS=system,audio,inet,input,net_bt_stack

# --- stock: Alexa is Android apps, started by the framework, not init.  Not used yet: alexa-off.sh will need
# `pm disable` of these (persistent ones first), and the trigger in hassmic.rc sys.boot_completed=1.
ALEXA_PROP=
ALEXA_SERVICES="ahe dacd"
ALEXA_PACKAGES="amazon.speech.sim com.amazon.bishop com.amazon.device.echoaudioservice com.amazon.afe.app com.amazon.alexadirectivebrokerservice com.amazon.alexa.awaservice com.amazon.ambienthome com.amazon.d3"
# firmware updates: an app with a sharedUserId of its own (not used yet: the firewall must cut its uid off)
UPDATE_SERVICES=
UPDATE_PACKAGES="com.amazon.device.software.ota"
UPDATE_ONDEMAND=
CLOUD_SERVICES="trackerd whad_cc quantum neo-init neo-coordinator shchipd shblemeshd shlocalskillsd smarthomewifid meshmgrservice inlocservice perfmonitord"
BT_SERVICE=
UX_SERVICE=
SETUP_SERVICES=
SETUP_PACKAGES="com.amazon.amasetup.service com.amazon.ds2.oobe.efd com.amazon.kindle.otter.oobe"
# Wi-Fi belongs to Android's WifiService in system_server; wpa_supplicant runs -O/data/misc/wifi/sockets -g@android:wpa_wlan0
WIFI_SERVICE=
WLAN=wlan0
WPA_SOCKETS=/data/misc/wifi/sockets

# --- Wi-Fi motion: no module yet (device.mk); wifimotion.c falls back to iwpriv RX_STAT
KMOD=
KMOD_ARGS=""

# --- firewall: no stock firewall.sh here; netd's chains and ACCEPT policies otherwise.  What lockdown.sh's keep needs
# beyond its own list, worded as "iptables -S" prints it, ";" between rules: DHCP answers (to the broadcast address,
# so conntrack does not take them for replies)
FW_KEEP="INPUT -i wlan0 -p udp -m udp --sport 67 --dport 68 -j ACCEPT"
