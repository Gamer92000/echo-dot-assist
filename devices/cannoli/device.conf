# Echo Dot 5th gen (cannoli), Fire OS NS6575 / 8349 (two units so far: devices/cannoli/README.md).  Shell syntax, no commands: sourced by the PC scripts
# (scripts/lib/device.sh) and, shipped next to them, by the scripts on the Echo (main.sh, lockdown.sh, alexa-off.sh, ...).

# --- identity: what the connected Echo must report before anything is written to it
MODEL_NAME="Echo Dot 5th gen (2022)"
MODEL_NUMBER=C2N6L4
PRODUCT=cannoli                   # getprop ro.product.device
FIRMWARE_ID=NS6575                    # getprop ro.build.display.id: the firmware everything was worked out against
FIRMWARE_FILE=update-kindle-cannoli-NS6575_user_8349_0013323246980.bin
FIRMWARE_SHA256=a55e7223383ec0c3987b0bcdda4105049a5433b11b1ef3d0053566b10f5996d9
DEFAULT_ARGS=""                          # hassmic arguments written to hassmic.conf at install (ARGS)
# The ring's animations are binary (acs_animation_list.txt, numbered .animation_bin): ring.c makes ours in that format,
# and Home Assistant's light goes through libhmled.so in ledcontroller (main.sh ledc_start, src/ledshim/ledshim.c).
# stock files that must be byte-identical to firmware/$DEVICE/rootfs/system (scripts/probe.sh)
PROBE_FILES="lib/libmixerAPI.so lib/libpryon.so lib/libasp.so bin/mixer bin/PuffinApp"

# --- installation: Cannoli uses NAND UBI and SquashFS, not donut's ext4.
# The offline firmware builder installs the files and patches the policy before packing.
INSTALL=cannoli-ubi
# magiskpolicy (32-bit ARM, bionic): Magisk v30.7's lib/armeabi-v7a/libmagiskpolicy.so (scripts/lib/setup.sh magiskpolicy_get),
# for the offline firmware builder's policy patch (install-system.sh refuses cannoli-ubi)
SEPOLICY_TOOL=firmware/cannoli/magiskpolicy32

# Rollback (devices/cannoli/prepare.sh): the factory copy lives in the overlay on /data, every promotion overwrites it,
# and a USB cable means opening the Echo.  So sysinstall.sh keeps the copy a promotion replaces in ROLLBACK/previous
# (only one that was reached from the network), main.sh writes down when the Echo is reached (ROLLBACK/reached, boots
# back to 0), and the flashed prepare.sh steps back after two boots without that (an unpromoted update, else to the
# previous copy, else to the flashed one).
ROLLBACK=/data/hassmic-system

# --- the daemon's user: AIPC refuses uid 0, so hassmic runs as the stock Alexa client's user with its groups.
# net_bt_stack: /dev/stpbt.  The mixer only records for effective group aipc (first in the list).
# drmrpc, keystore: the TEE behind the device attestation (dha.c) -- /dev/trustzone is 0660 system:drmrpc (1026),
# its certificate /persist/dha_certificate.pem 0660 keystore:keystore (1017); puffinmrmd carries both, and the HAL
# cannot add them itself once hassmic runs as puffin (measured: without keystore, field 0x203 answers -1).
DAEMON_USER=puffin
DAEMON_GROUPS=aipc,audio,system,inet,shell,dbus,ace_group,ace_kvstore,input,net_bt_stack,drmrpc,keystore,davs,cache,ace_maplite

# --- stock services
# Alexa client and friends, started by init once ledcontroller sets ALEXA_PROP=1 (same trigger in hassmic.rc)
ALEXA_PROP=com.amazon.puffin.PUFFIN_START
ALEXA_SERVICES="puffin puffinmrmd cmbd dacd smarthomed"
# firmware updates: daemons that run as UPDATE_UID (cut off by the firewall in MODE=stock-online), and the ones init
# starts on demand, which have to be stopped again and again
UPDATE_SERVICES="otad ace_otad"
UPDATE_UID=ace_otad
UPDATE_ONDEMAND=update_engine
# everything else that phones home (mixer, shmd, ledcontroller, acebuttond, netmgrd, wifisvc, perfmonitord stay: lockdown.sh)
# PowerDaemon too (its remote config from Arcus, Minerva metrics, the night mode): its night mode's time client
# connects to PuffinApp's AIPC service (com.amazon.puffin), and with Alexa stopped it went on with the null client and
# died of SIGSEGV every 25 s (2026-11-15: "TimeServiceClient::create - Failed to connect to uuid com.amazon.puffin",
# fault addr 0x30).  pwrsvcd, the power service itself, stays.
CLOUD_SERVICES="assetmgrd gadgetsd logmgr ace_metricd neo-coordinator neo-init usagestat_protod aceusagestatd trackerd provisionerd adepd sntpd time_update UdssCampSvc fmonitor ace_messaging ahe shs PowerDaemon"
# owns the Bluetooth controller in stock; must be gone before hassmic opens it (board.c: bt_service)
BT_SERVICE=btmanagerd
# set by Alexa once it has booted; the stock rc ends the boot swirl (anim_start_phase2) on it, alexa-off.sh sets it
BOOT_DONE_PROP=amazon.headless.BOOT_COMPLETED
# setup mode of an unregistered device: voice prompts, orange spinner, Wi-Fi Direct for the Alexa app
UX_SERVICE=uxeventd
SETUP_SERVICES="oobed_on_boot oobed_on_press oobed_on_no_nw"
# Amazon's Wi-Fi manager: its connectivity checks fail behind the egress lock (main.sh netwatch)
WIFI_SERVICE=wifisvc
WLAN=wlan0
# Keep the Wi-Fi awake (CAM), a wpa_supplicant driver command (main.sh netwatch, wifi_awake).  MediaTek gen4m only:
# wifi_awake checks it in that driver's `iwpriv <if> driver get_power_mode` ("enforce power mode N").  The driver's default is
# power save ("system power mode 2"; stock's wifisvc sends ENFORCE_POWER_MODE 0 while pwrsvcd holds a perflock and 3 to
# let go, and with wifisvc stopped every such request failed with -8, twice every 15 s).  Measured 2026-11-15, 100 UDP
# round trips from the LAN: power save median 4 ms, p90 26, p99 115; awake 3, 6, 14.  Broadcasts (arbitration's claims)
# wait for the next DTIM beacon in power save, a multiple of 102.4 ms.  The Echo runs on mains power
WIFI_AWAKE="ENFORCE_POWER_MODE 0"
WPA_SOCKETS=/data/misc/wifi/sockets

# --- Wi-Fi motion: our module reads every frame's RCPI from the driver (src/kmod/hassmic_rcpi4m.c, device.mk); main.sh
# loads it only once Wi-Fi motion is switched on.  KMOD_ARGS: module parameters for another driver build.
KMOD=hassmic_rcpi4m.ko
KMOD_ARGS=""

# Lockdown starts before stock firewall.sh. Keep DHCP replies available even
# while no address is assigned; broadcast replies need not match conntrack.
FW_KEEP="INPUT -i wlan0 -p udp -m udp --sport 67 --dport 68 -j ACCEPT"

