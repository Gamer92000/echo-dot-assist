"
# hassmic's home screen (tools/mkhome.py: no code, android.app.Activity, black): sysinstall.sh puts it in /system/app
HOME_APK=hassmic-home.apk
# Android's settings for a satellite (alexa-off.sh, "namespace/key=value"; old values back with alexa-on.sh): the screen
# off after 5 min as stock's (hassmic's light band keeps it there, 1 min with the mic off or in Do not disturb: ring_band.c;
# stock had 24 days with the camera off, the backlight at 238 of 255 all the time); Android's
# Bluetooth off (its app is off the partition too: /dev/stpbt is hassmic's, raw HCI as on the Dots: hciscan on the
# first Echo Show, 2026-10-13: reset, address 7c:d5:66:97:f7:7b, 315 LE adverts in 8 s once Android's stack let go)
ANDROID_SETTINGS="system/screen_off_timeout=300000 global/bluetooth_on=0 system/screen_brightness_mode=0 system/screen_brightness=120 system/accelerometer_rotation=0 system/user_rotation=1"
# the light band at the bottom of the screen (ring_band.c, ringbar.dex) reserves its rows with the window manager's
# overscan, which Android keeps in /data/system/display_settings.xml: alexa-on.sh gives them back
SCREEN_BAND=1
# a kernel wake lock root's main.sh holds while the satellite runs: with the screen off Android lets the SoC suspend
# once no wake lock is held (/sys/power/autosleep), and the satellite must keep listening
WAKE_LOCK=hassmic
# firmware updates: an app with a sharedUserId of its own (not used yet: the firewall must cut its uid off)
UPDATE_SERVICES=
UPDATE_PACKAGES="com.amazon.device.software.ota"
UPDATE_ONDEMAND=
CLOUD_SERVICES="trackerd whad_cc quantum neo-init neo-coordinator shchipd shblemeshd shlocalskillsd smarthomewifid meshmgrservice inlocservice perfmonitord"
BT_SERVICE=
UX_SERVICE=
SETUP_SERVICES=
SETUP_PACKAGES="com.amazon.amasetup.service com.amazon.kindle.otter.oobe"
# Wi-Fi belongs to Android's WifiService in system_server; wpa_supplicant runs -O/data/misc/wifi/sockets -g@android:wpa_wlan0
WIFI_SERVICE=
WLAN=wlan0
WPA_SOCKETS=/data/misc/wifi/sockets

# --- Wi-Fi motion: donut's module for the gen4m driver, its 32-bit ARM variant (device.mk); main.sh loads it only once
# Wi-Fi motion is switched on.  KMOD_ARGS: module parameters for another driver build.
KMOD=hassmic_rcpi4m.ko
KMOD_ARGS=""

# --- firewall: no stock firewall.sh here; netd's chains and ACCEPT policies otherwise.  What lockdown.sh's keep needs
# beyond its own list, worded as "iptables -S" prints it, ";" between rules: DHCP answers (to the broadcast address,
# so conntrack does not take them for replies)
FW_KEEP="INPUT -i wlan0 -p udp -m udp --sport 67 --dport 68 -j ACCEPT"
