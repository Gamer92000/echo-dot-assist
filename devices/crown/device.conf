# Echo Show 8 1st gen 2019 (crown), Fire OS 6.5.7.0 (NS6570, build 6074).  Shell syntax, no commands: sourced by the PC
# scripts (scripts/lib/device.sh) and, shipped next to them, by the scripts on the Echo.
# Same platform as checkers (MT8163, armv7, Android 7.1.2, kernel 4.9.77, full Android: Alexa is a set of apps, Wi-Fi is
# Android's WifiService, iptables belongs to netd), its own firmware build: docs/re-crown.md.  Values copied from
# checkers were checked against a running Echo Show 8 (2026-10-13) unless marked "verify".

# --- identity: what the connected Echo must report before anything is written to it
MODEL_NAME="Echo Show 8 1st gen (2019)"
MODEL_NUMBER=C7H6N3                       # the label on the Echo Show 8 1st gen (shown by setup.sh beside the model)
PRODUCT=crown                            # ro.product.device: no _puffin suffix on this one
FIRMWARE_ID=NS6570
FIRMWARE_FILE=update-kindle-crown-NS6570_user_6074_0012383140484.bin
FIRMWARE_SHA256=4b6fb088b4fba0f574ae6e830333f716bfbd1cb5aa1a72dfce642e14fdfce421
DEFAULT_ARGS=""                          # hassmic arguments at install (ARGS).  Bluetooth is hassmic's: Android's stack
                                         # (app/Bluetooth) goes off the partition with Amazon's apps (STOCK_APPS_OUT)
# stock files that must be byte-identical to firmware/$DEVICE/rootfs/system (scripts/probe.sh): the wake word engine and
# where the front end lives (audio HAL, audioflinger, the binder client), and stock's wake word service
PROBE_FILES="lib/libpryon.so lib/libasp.so lib/libaspclient.so lib/libaudioflinger.so vendor/lib/hw/audio.primary.mt8163.so lib/libwakewordserver_jni.so"

FIRMWARE_BUILD=0012383140484            # ro.build.version.incremental: the boot image is built from this build's own
# --- installation (scripts/install-boot.sh): not A/B (one system partition, dm-verity "verify" in fstab.mt8163), the
# policy in the boot ramdisk.  The boot image is NS6570's own with root adb, without verify, and with the policy patched
# for adb and our services (scripts/mkbootroot.py, sepolicy.rules), flashed in amonet's hacked fastboot; then the files go
# onto /system from the running OS, as on donut.  Only boot and system are ever written.
INSTALL=boot
BOOT_SHA256=08c129b92b0d04cf90d740e3c7af18069275619cbd189dc84d8bd63613b0c4a2   # boot.img in FIRMWARE_FILE
BOOT_DEV=/dev/block/platform/mtk-msdc.0/11230000.MSDC0/by-name/boot
SYSTEM_DEV=/dev/block/platform/mtk-msdc.0/11230000.MSDC0/by-name/system
# the system partition as NS6570 leaves it: tools/sdat2img.py of FIRMWARE_FILE's system.new.dat (reproducible), exactly
# the partition's size (3253731328 bytes).  devices/crown/setup.sh writes it in TWRP where the Echo runs another build
SYSTEM_IMG_SHA256=0877b48d2a256c9215ee18beabd48d89e1ad2e172b0e141fd538e934b3bf41db
# magiskpolicy (32-bit ARM, bionic) from donut's boot-root.zip, patch/magiskpolicy32; run on the PC under qemu-arm against
# firmware/crown/rootfs (tools/qrun.sh): the policy is patched before the Echo has root
SEPOLICY_TOOL=firmware/crown/magiskpolicy32
SEPOLICY_TOOL_SHA256=e5fafc1fa9486950ce9ba476f5723754d260014515ced72b4560238e6c560f3a
# adbd for the ramdisk: NS6570's own is a user build and never stays root (scripts/mkbootroot.py --adbd); this is sbin/adbd
# of the boot-root.img that amonet's crown thread supplies (CyanogenMod's, static, goes by ro.secure; byte-identical to
# checkers').  Root in su with it on a crown, 2026-10-13
ADBD=firmware/crown/adbd
ADBD_SHA256=108ba4032081ede6e2a5fbad3eeafa6d90948b93fe799f3e76555327f0f041ad

# --- the daemon's user: no AIPC for audio here.  AudioFlinger (libserviceutility.so recordingAllowed) lets root record
# without a package, any other uid only with one; system has "android".  Not root: hassmic faces the network.
# net_bt_stack for /dev/stpbt, input for the keys.  verify on the device
DAEMON_USER=system
DAEMON_GROUPS=system,audio,inet,input,net_bt_stack

# --- stock: Alexa is Android apps, started by the framework, not init: alexa-off.sh disables these with pm (and
# alexa-on.sh enables them again).  Many more apps carry Alexa's client library (paladin, the home screen, too); only
# those that fail without Alexa are listed.  NativeAccessorProxyServices (Alexa's bridge for native daemons) crashed
# with "Client already torn down!" once amazon.speech.sim was off, a "has stopped" dialog on the screen (2026-10-13).
# The screen is a satellite's, not Amazon's: Amazon's home screen (paladin, which needs amazon.speech.sim as well) and
# the apps that crashed in a loop after the install go too (whad 33 times in a minute, "Invalid CommonClock"; cardinal,
# alexa.datastore.app).  HOME is then Settings' FallbackHome: a blank screen.  Settings itself stays (FallbackHome is
# in it), but not its SettingsInitializationHelperService: once setup counts as complete it looks for the
# preference-settings.json a setup with Amazon would have downloaded, and crashed at every boot.
ALEXA_PROP=
ALEXA_SERVICES="ahe dacd"
ALEXA_PACKAGES="amazon.speech.sim com.amazon.bishop com.amazon.device.echoaudioservice com.amazon.afe.app com.amazon.alexa.awaservice com.amazon.ambienthome com.amazon.d3 com.amazon.NativeAccessorProxyServices com.amazon.paladin com.amazon.whad com.amazon.cardinal com.amazon.alexa.datastore.app com.amazon.a4b.conferencing.chime com.amazon.a4b.mcc com.amazon.csm.htmlruntime"
# Stock apps taken off the system partition altogether (sysinstall.sh, at install and with every update that becomes
# the factory copy; back at uninstall): paths under /system, kept in /system/hassmic-removed, where PackageManager does
# not look.  pm disable does not control them: Fire OS enables System UI again at the next boot, and starts its
# persistent apps at boot even disabled (amazon.speech.sim, whad, NativeAccessorProxyServices ran again with enabled=2,
# 2026-10-13).  So every Amazon app of /system/app and /system/priv-app (pm list packages -f on the first Echo Show:
# com.amazon.*, amazon.*, Ivona TTS, Arcus, the usage stats proxy, Sidewalk), System UI and Amazon's Settings among them
# (Settings cannot start without Amazon's account apps: "No central apk detected", CountryHelper throws), but not the
# ones whose APK is a shared library declared in /system/etc/permissions (amazon.jackson-19, com.amazon.communication,
# com.amazon.device.sync.sdk.internal, com.amazon.diode.eventsender, DeviceMessagingAndroid[Internal]SDK,
# DeviceSoftwareOTAContracts, MetricsApi, MinervaApi, RealtimeRegistryDeviceSDK): with them gone, FusedLocation (in
# system_server) and Settings failed to load, system_server restarted in a loop.  Stay too: Android's own, amazon.fireos
# (framework/fireos-res) and the vendor Wi-Fi profile manager.  Home is then hassmic's (HOME_APK).
# crown's last three entries: they load Amazon's identity library (MAPInit), which is gone with the other Amazon apps, and crash:
# the middleware in a loop every second (load average 9.6 on the first boot, 2026-10-14), the metrics service at start
STOCK_APPS_OUT="
app/AmazonDeviceMetrics app/AmazonWirelessMetricsService app/fdrw app/KnightBluetoothAVRCPClient
app/SidewalkDeviceService app/whad_app priv-app/AmaSetupService priv-app/AmazonKKWebViewLib
priv-app/amazon.speech.davs.davcservice priv-app/AmazonUsageStatsListener priv-app/ArcusListener
priv-app/Banyan-FireOS-Instance-amazon-release priv-app/bluestone-kb priv-app/com.amazon.adep
priv-app/com.amazon.afe.app priv-app/com.amazon.alarms priv-app/com.amazon.alexa.awaservice
priv-app/com.amazon.alexa.beaconbroadcaster priv-app/com.amazon.alexa.datastore.app
priv-app/com.amazon.alexa.externalmediaplayer.fireos priv-app/com.amazon.alexa.identity
priv-app/com.amazon.alexa.timeoutmanagerapp priv-app/com.amazon.alexa.visionapp-stub priv-app/com.amazon.alexaviz
priv-app/com.amazon.alexa.webmediaplayer.fireos priv-app/com.amazon.alexa.youtube.app priv-app/com.amazon.ambienthome
priv-app/com.amazon.apl.awsanalyticsextension priv-app/com.amazon.appaccesskeyprovider priv-app/com.amazon.aria
priv-app/com.amazon.assetsync.service priv-app/com.amazon.audiohome-stub priv-app/com.amazon.avod
priv-app/com.amazon.bishop priv-app/com.amazon.callexperiencecontroller.capabilityagent priv-app/com.amazon.cardinal
priv-app/com.amazon.coldbrew priv-app/com.amazon.comms.knightmessaging priv-app/com.amazon.comms.messagingcontroller
priv-app/com.amazon.comms.multimodaltachyonarm priv-app/com.amazon.communication.discovery priv-app/com.amazon.csapp
priv-app/com.amazon.d3 priv-app/com.amazon.device.sync priv-app/com.amazon.diode priv-app/com.amazon.dp.logger
priv-app/com.amazon.gloria.smarthome priv-app/com.amazon.h2clientservice
priv-app/com.amazon.identity.auth.device.authorization priv-app/com.amazon.imp
priv-app/com.amazon.kindleautomatictimezone priv-app/com.amazon.kindle.otter.oobe priv-app/com.amazon.knight.blink
priv-app/com.amazon.knightwebview priv-app/com.amazon.mlv priv-app/com.amazon.obscura
priv-app/com.amazon.ods.kindleconnect priv-app/com.amazon.paladin priv-app/com.amazon.rtcsessioncontroller
priv-app/com.amazon.securitysyncclient priv-app/com.amazon.selector.clock.resources
