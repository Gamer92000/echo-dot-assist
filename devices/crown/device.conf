priv-app/CrashManager priv-app/DeviceClientPlatformContractsFramework priv-app/DeviceMessagingAndroid
priv-app/DeviceSoftwareOTA priv-app/DeviceSoftwareOTAIdleOverride priv-app/EchoAudioService
priv-app/EnvironmentContextService priv-app/FireApplicationCompatibilityEnforcer
priv-app/FireApplicationCompatibilityEnforcerSDK priv-app/FireRecessProxy priv-app/GadgetsControlManager
priv-app/HumanDetectionService priv-app/HybridAdInfoService priv-app/IvonaTTS priv-app/IvonaTtsOrchestrator
priv-app/KnightSettings priv-app/KnightSystemUI priv-app/Logan priv-app/LogManager-logd
priv-app/marketplace_service_receiver priv-app/MultimodalWifiPasswordSyncApp priv-app/NativeAccessorProxyServices
