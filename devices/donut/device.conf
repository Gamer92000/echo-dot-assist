# Echo Dot 3rd gen 2018 (donut), Fire OS 6574.1 (NS65741).  Shell syntax, no commands: sourced by the PC scripts
# (scripts/lib/device.sh) and, shipped next to them, by the scripts on the Echo (main.sh, lockdown.sh, alexa-off.sh, ...).

# --- identity: what the connected Echo must report before anything is written to it
MODEL_NAME="Echo Dot 3rd gen (2018)"
MODEL_NUMBER=D9N29T
PRODUCT=donut_puffin                   # getprop ro.product.device
FIRMWARE_ID=NS65741                    # getprop ro.build.display.id: the firmware everything was worked out against
FIRMWARE_FILE=update-kindle-donut_puffin-NS65741_user_8138_0013222529668.bin
FIRMWARE_SHA256=ac22b78cf94c2ebacfa90447b770b803d9f72f35858d5218975d97fea95a0245
DEFAULT_ARGS=""                          # hassmic arguments written to hassmic.conf at install (ARGS)
# stock files that must be byte-identical to firmware/$DEVICE/rootfs/system (scripts/probe.sh)
PROBE_FILES="lib/libmixerAPI.so lib/libpryon.so lib/libasp.so bin/mixer bin/PuffinApp"

# --- installation (scripts/install-system.sh): TWRP from kamakiri, A/B system partitions with the policy at their root,
# boot-root's permissive su domain and its magiskpolicy
INSTALL=twrp-ab
SEPOLICY_TOOL=firmware/donut/boot-root/patch/magiskpolicy32

# --- the daemon's user: AIPC refuses uid 0, so hassmic runs as the stock Alexa client's user with its groups.
# net_bt_stack: /dev/stpbt.  The mixer only records for effective group aipc (first in the list).
DAEMON_USER=puffin
DAEMON_GROUPS=aipc,audio,system,inet,shell,dbus,ace_group,ace_kvstore,input,net_bt_stack

# --- stock services
# Alexa client and friends, started by init once ledcontroller sets ALEXA_PROP=1 (same trigger in hassmic.rc)
ALEXA_PROP=com.amazon.puffin.PUFFIN_START
ALEXA_SERVICES="puffin puffinmrmd dacd smarthomed"
# firmware updates: daemons that run as UPDATE_UID (cut off by the firewall in MODE=stock-online), and the ones init
# starts on demand, which have to be stopped again and again
UPDATE_SERVICES="otad ace_otad"
UPDATE_UID=ace_otad
UPDATE_ONDEMAND=update_engine
# everything else that phones home (mixer, shmd, ledcontroller, acebuttond, netmgrd, wifisvc, perfmonitord stay: lockdown.sh)
CLOUD_SERVICES="assetmgrd gadgetsd logmgr ace_metricd minerva_service usagestat_protod aceusagestatd trackerd provisionerd adepd sntpd UdssCampSvc fmonitor ace_messaging ahe shs"
# owns the Bluetooth controller in stock; must be gone before hassmic opens it (board.c: bt_service)
BT_SERVICE=btmanagerd
# setup mode of an unregistered device: voice prompts, orange spinner, Wi-Fi Direct for the Alexa app
UX_SERVICE=uxeventd
SETUP_SERVICES="oobed_on_boot oobed_on_press oobed_on_no_nw"
# Amazon's Wi-Fi manager: its connectivity checks fail behind the egress lock (main.sh netwatch)
WIFI_SERVICE=wifisvc
WLAN=wlan0
WPA_SOCKETS=/data/misc/wifi/sockets

# --- Wi-Fi motion: the driver's RX_STAT is the last frame from anyone on the channel, so our kernel module (src/kmod/,
# built per model, shipped next to main.sh) reads every frame from the access point in the driver's receive path.
# main.sh loads it only once Wi-Fi motion is switched on.  KMOD_ARGS: module parameters for another driver build.
KMOD=hassmic_rcpi4m.ko
KMOD_ARGS=""
