# Echo 2nd gen 2017 (radar), Fire OS 6572 - same OS generation as donut's 6574.1, one build older.  Shell syntax, no
# commands: sourced by the PC scripts (scripts/lib/device.sh) and, shipped next to them, by the Echo-side scripts.
# Values below the identity block are donut's; each needs a check on the running Echo before first install.

# --- identity: what the connected Echo must report before anything is written to it
MODEL_NAME="Echo 2nd gen (2017)"
MODEL_NUMBER=XC56PY                      # R0rt1z2's XDA thread
PRODUCT=radar_puffin                     # OTA metadata pre-device=radar_puffin
FIRMWARE_ID=NS6572
FIRMWARE_FILE=update-kindle-radar_puffin-NS6572_user_6436_0012718777476.bin
FIRMWARE_SHA256=976e2761c5bb9e5d3d9a2b1b9bc2f2296b89a5b37057ab1780743aa075f2df48
DEFAULT_ARGS=""                          # hassmic arguments written to hassmic.conf at install (ARGS).  Bluetooth tried on this
                                         # Echo 2026-10-10 (phone paired, aptX HD); before that it installed with -B
# stock files that must be byte-identical to firmware/$DEVICE/rootfs/system (scripts/probe.sh)
PROBE_FILES="lib/libmixerAPI.so lib/libpryon.so lib/libasp.so bin/mixer bin/PuffinApp"

# --- installation: amonet-radar v1.0.0 leaves the device with TWRP; the rest follows the donut flow.  Verify
# against scripts/install-system.sh expectations (A/B slots, lptools, policy location) on the running device.
INSTALL=twrp-ab
SEPOLICY_TOOL=firmware/radar/boot-root/patch/magiskpolicy32   # generic ARM tool; extracted in setup step "build"

# --- the daemon's user: donut's values for the same OS generation; verify with the puffin service's rc on the Echo
DAEMON_USER=puffin
# drmrpc: the attestation key's TEE session (dha.c) refuses a process without it
DAEMON_GROUPS=aipc,audio,system,inet,shell,dbus,ace_group,ace_kvstore,input,net_bt_stack,drmrpc

# --- stock services: donut's lists for the same OS generation; verify names/users on the Echo
ALEXA_PROP=com.amazon.puffin.PUFFIN_START
ALEXA_SERVICES="puffin puffinmrmd dacd smarthomed"
UPDATE_SERVICES="otad ace_otad"
UPDATE_UID=ace_otad
UPDATE_ONDEMAND=update_engine
CLOUD_SERVICES="assetmgrd gadgetsd logmgr ace_metricd minerva_service usagestat_protod aceusagestatd trackerd provisionerd adepd sntpd UdssCampSvc fmonitor ace_messaging ahe shs"
BT_SERVICE=btmanagerd
UX_SERVICE=uxeventd
SETUP_SERVICES="oobed_on_boot oobed_on_press oobed_on_no_nw"
WIFI_SERVICE=wifisvc
WLAN=wlan0
WPA_SOCKETS=/data/misc/wifi/sockets

# --- Wi-Fi motion: the gen2 Wi-Fi driver reports no frame levels, so our kernel module (src/kmod/, built per model,
# shipped next to main.sh) hooks its receive path.  main.sh loads it only once Wi-Fi motion is switched on.
# KMOD_ARGS: module parameters if this kernel's driver layout differs from biscuit's (none needed on biscuit, radar).
KMOD=hassmic_rcpi.ko
KMOD_ARGS=""
