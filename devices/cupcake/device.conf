# Echo Input 2018 (cupcake), Fire OS 6.5.7.5 (NS6575/8338).  Shell syntax, no commands: sourced by the PC scripts
# (scripts/lib/device.sh) and, shipped next to them, by the scripts on the Echo (main.sh, lockdown.sh, alexa-off.sh, ...).
# Worked out from the firmware (docs/re-cupcake.md), as found on a running Echo Input (2026-10-29).
# donut's platform (MT8516, A/B, the policy at the system partition's root, kamakiri's TWRP), checkers' software: Alexa
# is a set of apps, Wi-Fi is Android's WifiService, audio is Android's with the front end in the HAL.

# --- identity: what the connected Echo must report before anything is written to it
MODEL_NAME="Echo Input (2018)"
MODEL_NUMBER=C1125P
PRODUCT=cupcake                          # ro.product.device: no _puffin suffix on this one
FIRMWARE_ID=NS6575                       # getprop ro.build.display.id
FIRMWARE_FILE=update-kindle-cupcake-NS6575_user_8338_0013323244164.bin
FIRMWARE_SHA256=6f076e3193bd0431818147fe0f41172d55ed2fa8361f88b90368bdbed6da310b
DEFAULT_ARGS=""                          # hassmic arguments at install (ARGS).  Bluetooth is hassmic's: Android's stack
                                         # (app/Bluetooth) goes off the partition with Amazon's apps (STOCK_APPS_OUT)
# stock files that must be byte-identical to firmware/$DEVICE/rootfs/system (scripts/probe.sh): the wake word engine,
# where the front end lives (audio HAL, audioflinger, the binder client), stock's wake word service, the LED's driver
PROBE_FILES="lib/libpryon.so lib/libasp.so lib/libaspclient.so lib/libaudioflinger.so vendor/lib/hw/audio.primary.mt8167.so lib/libwakewordserver_jni.so lib/libled_hal.so bin/ledcontroller"

# --- installation (scripts/install-system.sh): as donut.  kamakiri-cupcake's TWRP, A/B system partitions with the policy
# at their root (system_root_image), root from donut's boot-root.zip (its system-as-root path: buildvariant on the boot
# command line, dm-verity off, default.prop, adbd's autoroot site at the same offset as donut's, permissive su), and its
# magiskpolicy for our rules
INSTALL=twrp-ab
SEPOLICY_TOOL=firmware/cupcake/boot-root/patch/magiskpolicy32
# Android's framework runs (WifiService has the Wi-Fi: wifictl.dex): the scripts ship and use it
ANDROID=1

# --- the daemon's user: no AIPC for audio here.  AudioFlinger lets root record without a package, any other uid only
# with one; system has "android" (as checkers).  Not root: hassmic faces the network.  net_bt_stack for /dev/stpbt, input
# for the keys
DAEMON_USER=system
DAEMON_GROUPS=system,audio,inet,input,net_bt_stack

# --- stock: Alexa is Android apps, started by the framework, not init: alexa-off.sh disables these with pm (and
# alexa-on.sh enables them again) until the install takes them off the partition (STOCK_APPS_OUT).  No init service of
# Alexa's own here (checkers' ahe and dacd are not in this firmware)
ALEXA_PROP=
ALEXA_SERVICES=
ALEXA_PACKAGES="amazon.speech.sim com.amazon.alexadirectivebrokerservice com.amazon.NativeAccessorProxyServices com.amazon.whad com.amazon.mediaplayeragent com.amazon.comms.headlesstachyon com.amazon.alexa.externalmediaplayer.fireos com.amazon.device.csmbluetooth.service com.amazon.device.csmbluetooth.headlessUxController com.amazon.headlessbeacon"
# Stock apps taken off the system partition altogether (sysinstall.sh, at install and with every update that becomes
# the factory copy; back at uninstall), for the reasons checkers found (device.conf there): pm disable does not hold the
# persistent ones (here amazon.speech.sim, whad, imp, tcomm, Banyan, the smart home and Bluetooth services, ...), and
# the rest fails without them.  Every Amazon app of /system/app and /system/priv-app, but not those whose APK is a
# shared library declared in /system/etc/permissions (amazon.jackson-19, com.amazon.communication,
# com.amazon.device.sync.sdk.internal, DeviceMessagingAndroid[Internal]SDK, DeviceSoftwareOTAContracts, MetricsApi,
# MinervaApi, RealtimeRegistryDeviceSDK), and not SimpleLauncher: Amazon's home, an APK without code (as hassmic's own
# home on the Shows), so no HOME_APK here.  Android's Bluetooth app goes too: /dev/stpbt is hassmic's.
STOCK_APPS_OUT="
app/AmazonDeviceMetrics app/AmazonWirelessMetricsService app/com.amazon.neo.delegateservice app/fdrw
app/SidewalkDeviceService app/whad_app priv-app/alexadirectivebrokerservice priv-app/AmaSetupService
priv-app/amazon.speech.davs.davcservice priv-app/AmazonUsageStatsListener priv-app/ArcusListener
priv-app/Banyan-FireOS-Instance-amazon-release priv-app/com.amazon.adep
priv-app/com.amazon.alexa.externalmediaplayer.fireos priv-app/com.amazon.comms.headlesstachyon
priv-app/com.amazon.comms.messagingcontroller priv-app/com.amazon.communication.discovery
priv-app/com.amazon.device.bluetoothdfu priv-app/com.amazon.device.sync priv-app/com.amazon.diode
priv-app/com.amazon.dp.logger priv-app/com.amazon.echo.csm.oobe priv-app/com.amazon.h2clientservice
priv-app/com.amazon.headlessbeacon priv-app/com.amazon.identity.auth.device.authorization priv-app/com.amazon.imp
priv-app/com.amazon.kindleautomatictimezone priv-app/com.amazon.mediaplayeragent priv-app/com.amazon.securitysyncclient
priv-app/com.amazon.spotify.mediabrowserservice-stub priv-app/com.amazon.tcomm priv-app/com.amazon.tcomm.jackson
priv-app/com.amazon.wha.mediabrowserservice-stub priv-app/com.amazon.whisperjoin.middleware.v2 priv-app/CrashManager
priv-app/CSMBluetoothV2 priv-app/DeviceClientPlatformContractsFramework priv-app/DeviceMessagingAndroid
priv-app/DeviceSoftwareOTA priv-app/DRCSService-arm priv-app/FireApplicationCompatibilityEnforcer
priv-app/FireApplicationCompatibilityEnforcerSDK priv-app/FireRecessProxy priv-app/GadgetsControlManager
priv-app/HeadlessBtUxController priv-app/LogManager-logd priv-app/MetricsService priv-app/NativeAccessorProxyServices
priv-app/NetworkDeregistrationController priv-app/RealtimeRegistryDevice priv-app/RemoteSettingsAndroid
priv-app/RemoteSettingsInternalSDK priv-app/SmartHomeBleAdapterService priv-app/SmartHomeConsentManagementCA
priv-app/SmartHomeEchoAdapterService priv-app/SmartHomeEndpointDetectorCA priv-app/SmartHomeHeadlessUxService
priv-app/SmartHomeOtaService priv-app/SmartHomeService priv-app/SmartHomeWifiAdapterService
priv-app/SpeechInteractionManager priv-app/ThrottleDownloads priv-app/UDPControllerService
app/Bluetooth
"
# Android's settings for a satellite (alexa-off.sh, "namespace/key=value"; old values back with alexa-on.sh): Android's
# Bluetooth off (its app is off the partition too)
ANDROID_SETTINGS="global/bluetooth_on=0"
# a kernel wake lock root's main.sh holds while the satellite runs: Android lets the SoC suspend once no wake lock is
# held, and with Amazon's apps gone nothing else holds one (/sys/power/autosleep)
WAKE_LOCK=hassmic
# firmware updates: the updater app (its own sharedUserId; stock-online cuts its uid off), and update_engine (A/B, root,
# class late_start), which it hands the payload to: kept stopped, as on donut
UPDATE_SERVICES=
UPDATE_PACKAGES="com.amazon.device.software.ota"
UPDATE_ONDEMAND=update_engine
CLOUD_SERVICES="trackerd whad_cc quantum neo-init neo-coordinator shchipd shblemeshd shlocalskillsd shlocalintegsd smarthomewifid meshmgrservice inlocservice perfmonitord"
BT_SERVICE=
UX_SERVICE=
# setup mode is the apps' (SETUP_PACKAGES): csm_oobe_setup and csm_dnsmasq are oneshots that only write files
SETUP_SERVICES=
SETUP_PACKAGES="com.amazon.amasetup.service com.amazon.echo.csm.oobe com.amazon.whisperjoin.middleware.v2"
# Wi-Fi belongs to Android's WifiService in system_server; wpa_supplicant runs -O/data/misc/wifi/sockets -g@android:wpa_wlan0
WIFI_SERVICE=
WLAN=wlan0
WPA_SOCKETS=/data/misc/wifi/sockets

# --- Wi-Fi motion: donut's module (device.mk); main.sh loads it only once Wi-Fi motion is switched on.  KMOD_ARGS:
# module parameters for another driver build.
KMOD=hassmic_rcpi4m.ko
KMOD_ARGS=""

# --- firewall: stock's firewall.sh runs at sys.boot_completed as on the Dots (INPUT/OUTPUT DROP), but DHCP is Android's
# here (DhcpClient in system_server, as on checkers): its answers come to the broadcast address, which no stock rule
# admits.  Worded as "iptables -S" prints it, ";" between rules
FW_KEEP="INPUT -i wlan0 -p udp -m udp --sport 67 --dport 68 -j ACCEPT"
