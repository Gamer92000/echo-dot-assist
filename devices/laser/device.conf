# Echo 4th gen (laser), Fire OS NS6575 / 8349.  Shell syntax, no commands: sourced by the PC scripts
# (scripts/lib/device.sh) and, shipped next to them, by the scripts on the Echo (main.sh, lockdown.sh, alexa-off.sh, ...).

# --- identity: what the connected Echo must report before anything is written to it
MODEL_NAME="Echo 4th gen (2020)"
MODEL_NUMBER=L4S3RE
PRODUCT=laser                   # getprop ro.product.device (ro.product.model: AEOLS)
FIRMWARE_ID=NS6575                    # getprop ro.build.display.id: the firmware everything was worked out against
FIRMWARE_FILE=update-kindle-laser_mt8512-NS6575_user_8349_0013323246980.bin
FIRMWARE_SHA256=a117deba405ba3d8c17f0a1b054e24274ebd14b703150536abc5b0f00f88218f
DEFAULT_ARGS=""                          # hassmic arguments written to hassmic.conf at install (ARGS)
# stock files that must be byte-identical to firmware/$DEVICE/rootfs/system (scripts/probe.sh)
PROBE_FILES="lib/libmixerAPI.so lib/libpryon.so lib/libasp.so bin/mixer bin/PuffinApp"

# --- installation: laser is eMMC with A/B slots and an ext4 system-as-root image, rooted through Firebreak's
# `unlock --device laser` (the preloader's USB window, a sealed loader in RAM) from a bundle that laser-os-builder
# bakes offline with `--port`: every file of this port's update bundle into /system/hassmic, the policy patched
# there too (devices/laser/README.md).  Nothing of that runs from here.
INSTALL=laser-emmc
# magiskpolicy (32-bit ARM, bionic): Magisk v30.7's lib/armeabi-v7a/libmagiskpolicy.so (scripts/lib/setup.sh
# magiskpolicy_get), for the offline firmware builder's policy patch (install-system.sh refuses laser-emmc)
SEPOLICY_TOOL=firmware/laser/magiskpolicy32

# Rollback (devices/laser/prepare.sh), as cannoli's: the factory copy lives in an overlay on /data, every promotion
# overwrites it, so sysinstall.sh keeps the copy a promotion replaces in ROLLBACK/previous (only one that was reached
# from the network), main.sh writes down when the Echo is reached (ROLLBACK/reached, boots back to 0), and the flashed
# prepare.sh steps back after two boots without that (an unpromoted update, else to the previous copy, else to the
# flashed one).
ROLLBACK=/data/hassmic-system

# --- the daemon's user: AIPC refuses uid 0, so hassmic runs as the stock Alexa client's user with its groups.
# The stock service puffin (/system/bin/PuffinApp, init.project.rc) has aipc davs dbus inet ace_kvstore ace_group
# drmrpc system audio keystore cache shell ace_maplite; input is added for the keys, net_bt_stack for /dev/stpbt.
# The mixer only records for effective group aipc (first in the list).
DAEMON_USER=puffin
# openthread: the radio's sockets in root's radio folder (main.sh radio_watch), never /dev/gp itself
DAEMON_GROUPS=aipc,audio,system,inet,shell,dbus,ace_group,ace_kvstore,input,net_bt_stack,drmrpc,keystore,davs,cache,ace_maplite,openthread

# --- stock services
# Alexa client and friends: init starts them once ledcontroller sets ALEXA_PROP=1 and the mixer is up
# (init.mt851x_amazon.rc: `on property:com.amazon.puffin.PUFFIN_START=1 && property:audio_mixer.init=true`)
ALEXA_PROP=com.amazon.puffin.PUFFIN_START
ALEXA_SERVICES="puffin puffinmrmd cmbd dacd smarthomed"
# firmware updates: daemons that run as UPDATE_UID (cut off by the firewall in MODE=stock-online), and the ones init
# starts on demand, which have to be stopped again and again
UPDATE_SERVICES="otad ace_otad"
UPDATE_UID=ace_otad
UPDATE_ONDEMAND=update_engine
# everything else that phones home (mixer, shmd, ledcontroller, acebuttond, netmgrd, wifisvc, perfmonitord stay: lockdown.sh)
CLOUD_SERVICES="assetmgrd gadgetsd logmgr ace_metricd neo-coordinator neo-init usagestat_protod aceusagestatd trackerd provisionerd adepd sntpd time_update UdssCampSvc fmonitor ace_messaging ahe shs PowerDaemon"
# owns the Bluetooth controller in stock; must be gone before hassmic opens it (board.c: bt_service)
BT_SERVICE=btmanagerd
# set by Alexa once it has booted; alexa-off.sh sets it
BOOT_DONE_PROP=amazon.headless.BOOT_COMPLETED
# setup mode of an unregistered device: voice prompts, orange spinner, Wi-Fi Direct for the Alexa app
UX_SERVICE=uxeventd
SETUP_SERVICES="oobed_on_boot oobed_on_press oobed_on_no_nw"
# Amazon's Wi-Fi manager: its connectivity checks fail behind the egress lock (main.sh netwatch)
WIFI_SERVICE=wifisvc
WLAN=wlan0
# Keep the Wi-Fi awake (CAM), a wpa_supplicant driver command (main.sh netwatch, wifi_awake).  The driver is cannoli's
# wlan_mt76x3_sdio (gen4m: `iwpriv wlan0 driver get_power_mode` answers "enforce power mode 0  system power mode: 2"
# on a stock Echo, 2026-11-26), so its command applies here too.  The Echo runs on mains power.
WIFI_AWAKE="ENFORCE_POWER_MODE 0"
WPA_SOCKETS=/data/misc/wifi/sockets
# Wi-Fi motion (device.mk: the module and why): main.sh loads it only once Wi-Fi motion is switched on.  KMOD_ARGS:
# module parameters for another driver build.
KMOD=hassmic_rcpi4m.ko
KMOD_ARGS=""

# The light ring live (ringlive.c, board.c ring_led_color / ring_led_power): each LED's colour file of the two LP5036
# and the chips' supply switches, given to hassmic's LED group by root (main.sh led_frame).  A list, globs allowed
LED_FRAME="/sys/class/leds/lp5036:ledmod_*/color /sys/class/i2c-dev/i2c-0/device/0-0030/ledhven /sys/class/i2c-dev/i2c-0/device/0-0031/ledhven"

# Thread and Zigbee (docs/re-thread.md; hassmic's radio.c, main.sh radio_watch): a Qorvo GP712 on /dev/gp
# (zigbee:fifteen_four 0660, init.zigbee.rc), Amazon's OpenThread RCP for it (board.c radio_rcp, the same path).
# Stock's border router (otservice: otbr-agent with that RCP on a pty), its Thread service and its Zigbee hub, which
# init starts at every wlan.driver.status=ok (init.openthread.rc, init.connthreadservice.rc, init.zigbeeservice.rc),
# stopped for good; SmartHomed is in ALEXA_SERVICES.  Ours run as stock's border router did: user openthread, the
# radio's group, inet, vpn (/dev/tun is system:vpn), net_admin, net_raw
RADIO_RCP=/system/bin/ot-rcp
RADIO_SERVICES="otservice connthreadsvc zigbeeservice"
RADIO_USER=openthread
RADIO_GROUPS=openthread,fifteen_four,inet,vpn,net_admin,net_raw

# Lockdown starts before stock firewall.sh. Keep DHCP replies available even
# while no address is assigned; broadcast replies need not match conntrack.
FW_KEEP="INPUT -i wlan0 -p udp -m udp --sport 67 --dport 68 -j ACCEPT"
