# Where online updates come from (src/hassmic/update.c: GitHub releases of UPDATE_REPO) and the public key their bundles
# are signed with (RELEASE_PUB, in every bundle and install as release.pub).  Read by the Makefile, the PC scripts
# (scripts/lib/device.sh release_load) and CI, in both make's and sh's syntax: NAME=value, no quotes, no spaces (make
# would keep quotes sh drops; such a value is refused).  A fork that publishes releases of its own sets both in
# secrets/fork.conf (scripts/fork-release.sh), outside git: its tree stays this one, and its pull requests carry
# nothing of it.
UPDATE_REPO=Gamer92000/echo-dot-assist
RELEASE_PUB=keys/release.pub
