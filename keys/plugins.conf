# The plugin index (docs/plugins.md 5.3; the repository hassmic-plugins): where an Echo reads which plugins there are
# (PLUGIN_INDEX: the site GitHub Pages serves, index.json, revoked.json, packages/, with a "/" at its end) and the
# public key that signs the list, the revocation list and each package's listing (PLUGINS_PUB: a copy of that
# repository's keys/index.pub; built into hassmic, src/hassmic/plugin_index.c).  What that key lists as official is
# official on every Echo of this build: see docs/SECURITY.md "Plugins".  Read by the Makefile, in make's and sh's
# syntax as keys/release.conf: NAME=value, no quotes, no spaces.  A fork with an index of its own sets them in
# secrets/fork.conf, which the Makefile reads after this file (scripts/fork-release.sh writes them there, from the
# fork's repository variables in CI, DEVELOPMENT.md "Releases from a fork"); a build whose PLUGINS_PUB is another key
# than PLUGINS_PUB2_WITH names never takes this file's PLUGINS_PUB2 beside it.
PLUGIN_INDEX=https://gamer92000.github.io/hassmic-plugins/
PLUGINS_PUB=keys/plugins.pub
# A second index key, empty but for a change of the index's key (docs/plugins.md 5.2 "A new index key", step 1): a
# file of 32 bytes like PLUGINS_PUB, the new key's public half.  A build with it takes either key's signature for the
# index, the revocation list and every package's listing (plugin_index.c pi_keys); released and given time to reach
# the Echos before the index signs with the new key (step 2), then a build with the new key alone (step 3: it becomes
# PLUGINS_PUB, this empty again).  While it is set, whoever holds either key holds the index.  PLUGINS_PUB2_WITH:
# the hex of the first key it belongs with (od -An -tx1 -v keys/plugins.pub | tr -d ' \n'), set with it: a build
# whose first key is another (a fork's own, keys/plugins.pub replaced, make PLUGINS_PUB=...) leaves the second out.
# No key may be one under which any signature holds (small order, src/include/edkey.h): the Makefile refuses it.
PLUGINS_PUB2=
PLUGINS_PUB2_WITH=
# The least serials this build takes (docs/plugins.md 5.5): an index or a revocation list with a lower serial is
# refused, also by an Echo that has never seen one (new, or after a factory reset), so that an old signed list
# cannot be handed to it.  Both are times (the index's commit, the revocation list's change).  Set by hand before a
# release from what the index has published (scripts/plugins-least.sh reads the site, checks both signatures against
# PLUGINS_PUB and writes them here; DEVELOPMENT.md "CI and releases"); 0 while nothing is published.  Never higher
# than the site's: an Echo of this build would refuse every list it can get
PLUGINS_LEAST_INDEX=0
PLUGINS_LEAST_REVOKED=0
